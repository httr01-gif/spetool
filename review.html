<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료 검토 · 관리자</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1e2230; --mut:#666d82; --dim:#99a0b3; --surface:#fff; --surface-2:#f6f7fb;
    --line:rgba(24,30,60,.09); --blue:#3b63e8; --blue-d:#2b4dcc; --blue-soft:#e9eefd;
    --coral:#ef6f45; --coral-d:#d4552c; --coral-soft:#fdeae2;
    --ok:#0f9a6a; --ok-soft:#e4f6ef; --warn-soft:#fff5e0; --warn-d:#96650a;
    --sh:0 1px 2px rgba(28,34,70,.04), 0 8px 26px rgba(28,34,70,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#e8ebf3; --mut:#a6adc0; --dim:#7d8497; --surface:#1d2029; --surface-2:#23262f;
      --line:rgba(255,255,255,.10); --blue:#7d9bff; --blue-d:#a8bcff; --blue-soft:#232c48;
      --coral:#ff8a63; --coral-d:#ffa585; --coral-soft:#3a2720;
      --ok:#4ad3a0; --ok-soft:#183028; --warn-soft:#33280f; --warn-d:#f0c469;
      --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0; color:var(--ink); font-size:16px; line-height:1.6;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--surface-2); min-height:100vh}
  .wrap{max-width:960px; margin:0 auto; padding:26px 18px 70px}
  a{color:var(--blue-d)}
  h1{font-size:1.4rem; font-weight:800; margin:0 0 6px; letter-spacing:-.02em}
  .lead{color:var(--mut); font-size:.93rem; margin:0 0 20px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--sh); margin-bottom:16px}
  input[type=password],input[type=text]{width:100%; font:inherit; color:inherit; background:var(--surface-2);
    border:1px solid var(--line); border-radius:11px; padding:11px 13px; outline:0}
  input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
  .btn{border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:9px 15px;
    cursor:pointer; font-size:.88rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
  .btn.pri{background:var(--blue); border-color:var(--blue); color:#fff}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#fff}
  .btn.no{background:var(--surface); border-color:var(--coral); color:var(--coral-d)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .st{font-size:.74rem; font-weight:800; padding:4px 11px; border-radius:999px}
  .st.pending{background:var(--warn-soft); color:var(--warn-d)}
  .st.approved{background:var(--ok-soft); color:var(--ok)}
  .st.rejected{background:var(--coral-soft); color:var(--coral-d)}
  .row{border-top:1px solid var(--line); padding:18px 0}
  .row:first-of-type{border-top:0; padding-top:0}
  .rh{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
  .rh b{font-size:1.05rem; font-weight:800}
  .rmeta{font-size:.82rem; color:var(--dim); margin-bottom:8px}
  .rsum{color:var(--mut); font-size:.92rem; margin-bottom:10px}
  details.raw{margin-top:10px}
  details.raw summary{cursor:pointer; font-size:.84rem; color:var(--blue-d); font-weight:700}
  pre{white-space:pre-wrap; word-break:break-word; background:var(--surface-2); border:1px solid var(--line);
    border-radius:11px; padding:13px; font-size:.8rem; max-height:300px; overflow:auto; margin:10px 0 0}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
  .tab{border:0; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 16px;
    cursor:pointer; font-size:.86rem; font-weight:700}
  .tab[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
  .msg{padding:12px 14px; border-radius:11px; font-size:.9rem; font-weight:600; display:none; margin-top:12px}
  .msg.err{display:block; background:var(--coral-soft); color:var(--coral-d)}
  .empty{text-align:center; color:var(--dim); padding:44px 10px}
</style>
</head>
<body>
<div class="wrap">
  <p style="margin:0 0 14px"><a href="index.html">← 도구함으로 돌아가기</a></p>
  <h1>자료 검토</h1>
  <p class="lead">선생님들이 올린 자료를 확인하고 공개 여부를 정합니다. 승인해야 도구함 목록에 나타납니다.</p>

  <div class="card" id="gate">
    <label style="display:block; font-size:.85rem; font-weight:700; margin-bottom:6px">관리자 열쇠</label>
    <div class="bar">
      <input type="password" id="key" placeholder="STATS_KEY 값" autocomplete="off" style="flex:1; min-width:200px">
      <button class="btn pri" id="go">열기</button>
    </div>
    <div class="msg" id="gmsg"></div>
  </div>

  <div id="main" hidden>
    <div class="tabs">
      <button class="tab" data-f="pending" aria-pressed="true">확인 대기 <span class="c"></span></button>
      <button class="tab" data-f="approved" aria-pressed="false">공개 중 <span class="c"></span></button>
      <button class="tab" data-f="rejected" aria-pressed="false">보류 <span class="c"></span></button>
      <button class="tab" data-f="all" aria-pressed="false">전체</button>
      <button class="btn" id="refresh" style="margin-left:auto">새로고침</button>
    </div>
    <div class="card" id="list"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY = "", all = [], filter = "pending";
var listEl = document.getElementById("list");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function load(){
  return fetch("/api/review?key=" + encodeURIComponent(KEY))
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      if (!res.ok) throw new Error((res.j && res.j.error) || "불러오지 못했습니다.");
      all = res.j.items || [];
      return all;
    });
}

function counts(){
  var c = { pending:0, approved:0, rejected:0 };
  all.forEach(function(m){ if (c[m.status] != null) c[m.status]++; });
  document.querySelectorAll(".tab").forEach(function(t){
    var f = t.dataset.f, s = t.querySelector(".c");
    if (s) s.textContent = c[f] != null ? c[f] : "";
  });
}

var LABEL = { pending:"확인 대기", approved:"공개 중", rejected:"보류" };

function render(){
  counts();
  var rows = all.filter(function(m){ return filter === "all" || m.status === filter; });
  if (!rows.length){ listEl.innerHTML = '<div class="empty">해당하는 자료가 없습니다.</div>'; return; }

  listEl.innerHTML = rows.map(function(m){
    var meta = [
      "올린 사람 " + esc(m.uploader || "-"),
      esc(m.subject) + " / " + esc(m.grade) + " / " + esc(m.form),
      Math.round((m.bytes||0)/1024) + "KB",
      esc((m.createdAt||"").slice(0,10))
    ].join("  |  ");

    var acts = '<a class="btn" href="/api/app?id=' + esc(m.id) + '" target="_blank" rel="noopener">미리 실행</a>';
    if (m.status !== "approved") acts += '<button class="btn ok" data-a="approve" data-id="' + esc(m.id) + '">공개 승인</button>';
    if (m.status !== "rejected") acts += '<button class="btn no" data-a="reject" data-id="' + esc(m.id) + '">보류</button>';
    acts += '<button class="btn no" data-a="delete" data-id="' + esc(m.id) + '">삭제</button>';

    return '<div class="row">' +
      '<div class="rh"><b>' + esc(m.name) + '</b><span class="st ' + esc(m.status) + '">' + (LABEL[m.status]||m.status) + '</span></div>' +
      '<div class="rmeta">' + meta + '</div>' +
      '<div class="rsum">' + esc(m.summary) + '</div>' +
      (m.support ? '<div class="rsum" style="font-size:.86rem">지원 방법: ' + esc(m.support) + '</div>' : '') +
      '<div class="bar">' + acts + '</div>' +
      '<details class="raw"><summary>HTML 원문 확인</summary><pre data-raw="' + esc(m.id) + '">불러오려면 펼쳐 주세요</pre></details>' +
      (m.prompt ? '<details class="raw"><summary>제작 프롬프트 확인</summary><pre>' + esc(m.prompt) + '</pre></details>' : '') +
      '</div>';
  }).join("");

  listEl.querySelectorAll("[data-a]").forEach(function(b){
    b.onclick = function(){
      var a = b.dataset.a;
      if (a === "delete" && !confirm("이 자료를 완전히 지웁니다. 되돌릴 수 없습니다. 계속할까요?")) return;
      b.disabled = true;
      fetch("/api/review", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ key:KEY, id:b.dataset.id, action:a })
      }).then(function(r){ return r.json(); })
        .then(function(){ return load(); })
        .then(render)
        .catch(function(e){ alert("처리하지 못했습니다: " + e.message); b.disabled = false; });
    };
  });

  listEl.querySelectorAll("details.raw").forEach(function(d){
    d.addEventListener("toggle", function(){
      var pre = d.querySelector("pre[data-raw]");
      if (!d.open || !pre || pre.dataset.done) return;
      pre.dataset.done = "1";
      fetch("/api/review?key=" + encodeURIComponent(KEY) + "&raw=1&id=" + encodeURIComponent(pre.dataset.raw))
        .then(function(r){ return r.text(); })
        .then(function(t){ pre.textContent = t.slice(0, 40000); })
        .catch(function(){ pre.textContent = "원문을 불러오지 못했습니다."; });
    });
  });
}

document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    filter = t.dataset.f;
    document.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-pressed", String(x === t)); });
    render();
  };
});
document.getElementById("refresh").onclick = function(){ load().then(render).catch(function(e){ alert(e.message); }); };

document.getElementById("go").onclick = function(){
  KEY = document.getElementById("key").value.trim();
  var gm = document.getElementById("gmsg");
  if (!KEY){ gm.className = "msg err"; gm.textContent = "열쇠를 입력해 주세요."; return; }
  load().then(function(){
    try{ sessionStorage.setItem("tb.rk", KEY); }catch(e){}
    document.getElementById("gate").hidden = true;
    document.getElementById("main").hidden = false;
    render();
  }).catch(function(e){
    gm.className = "msg err"; gm.textContent = e.message;
  });
};
document.getElementById("key").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("go").click();
});
try{
  var saved = sessionStorage.getItem("tb.rk");
  if (saved){ document.getElementById("key").value = saved; document.getElementById("go").click(); }
}catch(e){}
})();
</script>
</body>
</html>
