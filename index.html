<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특수교육 AI 도구함</title>
<meta name="description" content="경산자인학교에서 개발한 특수교육대상학생용 웹 수업자료를 바로 실행하고 내려받으며 제작 프롬프트를 확인할 수 있습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6eb; --line2:#eef0f4;
    --fg:#1c1f24; --mut:#63697a; --dim:#8a90a0;
    --brand:#2f6df6; --brand-d:#1b52d0; --brand-soft:#eaf1ff;
    --ok:#0f9d6b; --warn:#b5710b;
    --radius:14px; --fs:1rem; --shadow:0 1px 2px rgba(20,25,40,.05),0 6px 18px rgba(20,25,40,.06);
  }
  html[data-fs="l"]{ --fs:1.13rem }
  html[data-fs="xl"]{ --fs:1.3rem }
  html[data-hc="1"]{
    --bg:#000; --panel:#000; --line:#fff; --line2:#fff; --fg:#fff; --mut:#fff; --dim:#fff;
    --brand:#ffdd00; --brand-d:#ffdd00; --brand-soft:#000; --ok:#00ff88; --warn:#ffdd00;
    --shadow:none;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-hc="1"]){
      --bg:#14161b; --panel:#1c1f26; --line:#30353f; --line2:#262a32;
      --fg:#e9ecf2; --mut:#a6adbb; --dim:#7f8799; --brand:#78a4ff; --brand-d:#a9c4ff; --brand-soft:#1f2941;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg); font-size:var(--fs);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1120px; margin:0 auto; padding-inline:16px}
  a{color:inherit}
  button,select,input{font:inherit; color:inherit}

  /* 헤더 */
  header{background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .hrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:14px}
  .logo{display:flex; align-items:baseline; gap:10px; margin-right:auto}
  .logo b{font-size:1.22em; letter-spacing:-.02em}
  .logo span{color:var(--mut); font-size:.86em}
  .a11y{display:flex; gap:6px; align-items:center}
  .a11y button{
    border:1px solid var(--line); background:var(--panel); border-radius:9px;
    padding:6px 10px; cursor:pointer; font-size:.84em; white-space:nowrap;
  }
  .a11y button[aria-pressed="true"]{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-d); font-weight:700}
  .searchbar{display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--panel);
    border-radius:12px; padding:10px 12px; margin-bottom:14px}
  .searchbar:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .searchbar input{flex:1; border:0; outline:0; background:transparent; min-width:0}
  .searchbar .x{border:0; background:transparent; cursor:pointer; color:var(--dim); padding:2px 6px; visibility:hidden}
  .searchbar .x.on{visibility:visible}

  /* 필터 */
  #fwrap{margin:16px 0}
  #fwrap>summary{display:none; cursor:pointer; list-style:none; font-size:.88em; font-weight:700;
    border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 13px}
  #fwrap>summary::-webkit-details-marker{display:none}
  #fwrap>summary::after{content:" 펴기"; font-weight:400; color:var(--dim)}
  #fwrap[open]>summary::after{content:" 접기"}
  .filters{display:flex; flex-direction:column; gap:8px; margin:0}
  .frow{display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap}
  .flabel{font-size:.8em; color:var(--dim); min-width:46px; padding-top:7px; flex-shrink:0}
  .chip{
    border:1px solid var(--line); background:var(--panel); border-radius:999px;
    padding:5px 12px; cursor:pointer; font-size:.86em; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700}
  html[data-hc="1"] .chip[aria-pressed="true"]{color:#000}
  .chip .n{opacity:.65; margin-left:5px; font-size:.9em}

  .rbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:18px 0 10px}
  .rcount{color:var(--mut); font-size:.9em; margin-right:auto}
  .rcount b{color:var(--fg)}
  .rbar select{border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:6px 10px; font-size:.86em}
  .linkbtn{border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:6px 10px; cursor:pointer; font-size:.86em}

  /* 카드 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; padding-bottom:8px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
  }
  .card.note{border-style:dashed}
  .badges{display:flex; gap:6px; flex-wrap:wrap}
  .b{font-size:.74em; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--mut); white-space:nowrap}
  .b.sub{background:var(--brand-soft); border-color:transparent; color:var(--brand-d); font-weight:700}
  .b.new{background:var(--ok); border-color:transparent; color:#fff; font-weight:700}
  html[data-hc="1"] .b.new,html[data-hc="1"] .b.sub{color:#000; background:var(--brand)}
  .cname{font-size:1.1em; font-weight:800; letter-spacing:-.01em; line-height:1.35}
  .csum{color:var(--mut); font-size:.92em; flex:1}
  .meta{display:flex; gap:8px; flex-wrap:wrap; font-size:.8em; color:var(--dim)}
  .tags{display:flex; gap:5px; flex-wrap:wrap}
  .tag{font-size:.76em; color:var(--mut); background:var(--line2); padding:2px 8px; border-radius:6px}
  html[data-hc="1"] .tag{background:#000; color:#fff; border:1px solid #fff}
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:2px}
  .btn{
    border:1px solid var(--line); background:var(--panel); border-radius:10px;
    padding:9px 13px; cursor:pointer; font-size:.88em; font-weight:600; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--brand)}
  .btn.pri{background:var(--brand); border-color:var(--brand); color:#fff}
  html[data-hc="1"] .btn.pri{color:#000}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .notice{font-size:.85em; color:var(--warn); background:var(--line2); border-radius:9px; padding:9px 11px}
  html[data-hc="1"] .notice{border:1px solid var(--line); background:#000}

  .empty{text-align:center; padding:60px 20px; color:var(--dim)}
  footer{margin:40px 0 60px; padding-top:20px; border-top:1px solid var(--line); color:var(--dim); font-size:.84em}
  footer p{margin:.4em 0}

  /* 상세 */
  dialog.sheet{
    border:0; padding:0; background:transparent; max-width:720px; width:calc(100% - 28px);
    max-height:88vh; color:var(--fg);
  }
  dialog.sheet::backdrop{background:rgba(10,14,25,.55); backdrop-filter:blur(2px)}
  .sheet-in{background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:auto; max-height:88vh}
  .sheet-hd{position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line);
    padding:16px 18px; display:flex; align-items:flex-start; gap:12px; z-index:2}
  .sheet-hd h2{margin:0; font-size:1.18em; letter-spacing:-.01em}
  .sheet-hd .close{margin-left:auto; border:1px solid var(--line); background:var(--panel);
    border-radius:9px; width:34px; height:34px; cursor:pointer; flex-shrink:0; font-size:1.05em}
  .sheet-bd{padding:18px}
  .sec{margin-bottom:20px}
  .sec h3{margin:0 0 8px; font-size:.82em; color:var(--dim); font-weight:700; letter-spacing:.04em}
  .sec ul{margin:0; padding-left:1.15em}
  .sec li{margin:.25em 0}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.92em}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0}
  pre.prompt{
    margin:0; white-space:pre-wrap; word-break:break-word; background:var(--bg);
    border:1px solid var(--line); border-radius:11px; padding:14px; font-size:.86em; line-height:1.62;
    max-height:340px; overflow:auto; font-family:ui-monospace,SFMono-Regular,Menlo,"Malgun Gothic",monospace;
  }
  .sechd{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .sechd h3{margin:0}
  .sechd .btn{margin-left:auto; padding:5px 10px; font-size:.8em}
  #qr{display:flex; justify-content:center; padding:14px; background:#fff; border-radius:11px; border:1px solid var(--line)}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); opacity:0; pointer-events:none;
    background:var(--fg); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:.9em; font-weight:600;
    transition:.2s; z-index:99;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .flabel{min-width:100%; padding-top:0}
    #fwrap>summary{display:block}
    #fwrap[open]>summary{margin-bottom:10px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="logo"><b>특수교육 AI 도구함</b><span id="org"></span></div>
      <div class="a11y">
        <button id="fs" title="글자 크기 바꾸기">가 크기</button>
        <button id="hc" aria-pressed="false" title="고대비 화면 켜고 끄기">고대비</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="searchbar" style="margin-top:16px">
    <span aria-hidden="true">🔍</span>
    <input type="search" id="q" placeholder="자료명, 설명, 키워드로 찾기  (예: 컬링, 보드게임, 치아, 편견)" autocomplete="off" aria-label="자료 검색">
    <button class="x" id="qx" title="검색어 지우기" aria-label="검색어 지우기">✕</button>
  </div>

  <details id="fwrap" open><summary id="fsum">필터</summary><div class="filters" id="filters"></div></details>

  <div class="rbar">
    <div class="rcount"><b id="rn">0</b>건<span id="rtot"></span></div>
    <select id="sort" aria-label="정렬 방식">
      <option value="default">기본순</option>
      <option value="name">이름순</option>
      <option value="subject">교과순</option>
      <option value="updated">최신순</option>
    </select>
    <button class="linkbtn" id="reset">필터 초기화</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>조건에 맞는 자료가 없습니다. 검색어를 줄이거나 필터를 초기화해 보세요.</div>

  <footer>
    <p><b>이용 안내</b></p>
    <p>모든 자료는 파일 하나로 동작합니다. 내려받은 뒤 인터넷 연결 없이 열어서 쓸 수 있습니다.</p>
    <p>수업에 맞게 고쳐 쓰셔도 됩니다. 제작 프롬프트를 복사해 생성형 AI에 넣으면 우리 반에 맞는 자료를 새로 만들 수 있습니다.</p>
    <p id="foot-org"></p>
  </footer>
</div>

<dialog class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sheet-hd">
      <h2 id="d-name"></h2>
      <button class="close" id="d-close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-bd" id="d-body"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

var DATA = null, items = [];
var state = { q:"", subject:"", grade:"", form:"", device:"", sort:"default" };
var FKEYS = [
  { key:"subject", label:"교과" },
  { key:"grade",   label:"학년" },
  { key:"form",    label:"형태" },
  { key:"device",  label:"환경" }
];
var GRADE_ORDER = ["초등","중학","고등","전공과","공통"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}

/* ── 사용 기록 (화면에는 표시하지 않음) ── */
function track(id, action){
  try{
    var payload = JSON.stringify({ id:id, action:action });
    if (navigator.sendBeacon){
      navigator.sendBeacon("/api/track", new Blob([payload], { type:"application/json" }));
    } else {
      fetch("/api/track", { method:"POST", headers:{ "Content-Type":"application/json" },
        body:payload, keepalive:true }).catch(function(){});
    }
  }catch(e){}
}

/* ── 접근성 설정 ── */
var FS = ["","l","xl"], fsIdx = 0;
function applyPrefs(){
  var h = document.documentElement;
  if (FS[fsIdx]) h.setAttribute("data-fs", FS[fsIdx]); else h.removeAttribute("data-fs");
  try{ localStorage.setItem("tb.fs", String(fsIdx)); }catch(e){}
}
function initPrefs(){
  try{
    var f = localStorage.getItem("tb.fs"); if (f) fsIdx = Math.min(2, Math.max(0, parseInt(f,10)||0));
    if (localStorage.getItem("tb.hc") === "1"){
      document.documentElement.setAttribute("data-hc","1");
      document.getElementById("hc").setAttribute("aria-pressed","true");
    }
  }catch(e){}
  applyPrefs();
}
document.getElementById("fs").onclick = function(){ fsIdx = (fsIdx + 1) % 3; applyPrefs(); };
document.getElementById("hc").onclick = function(){
  var h = document.documentElement, on = h.getAttribute("data-hc") === "1";
  if (on) h.removeAttribute("data-hc"); else h.setAttribute("data-hc","1");
  this.setAttribute("aria-pressed", String(!on));
  try{ localStorage.setItem("tb.hc", on ? "0" : "1"); }catch(e){}
};

/* ── 필터 ── */
function valuesOf(key){
  var m = {};
  items.forEach(function(it){
    var v = it[key];
    (Array.isArray(v) ? v : [v]).forEach(function(x){ if (x) m[x] = (m[x]||0) + 1; });
  });
  var ks = Object.keys(m);
  if (key === "grade"){
    ks.sort(function(a,b){
      var ia = GRADE_ORDER.indexOf(a), ib = GRADE_ORDER.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
  } else {
    ks.sort(function(a,b){ return m[b]-m[a] || a.localeCompare(b,"ko"); });
  }
  return ks.map(function(k){ return { v:k, n:m[k] }; });
}

function buildFilters(){
  var html = FKEYS.map(function(f){
    var vals = valuesOf(f.key);
    if (!vals.length) return "";
    return '<div class="frow"><span class="flabel">' + f.label + '</span>' +
      '<button class="chip" data-k="' + f.key + '" data-v="" aria-pressed="false">전체</button>' +
      vals.map(function(x){
        return '<button class="chip" data-k="' + f.key + '" data-v="' + esc(x.v) + '" aria-pressed="false">' +
          esc(x.v) + '<span class="n">' + x.n + '</span></button>';
      }).join("") + '</div>';
  }).join("");
  document.getElementById("filters").innerHTML = html;
  document.querySelectorAll("#filters .chip").forEach(function(b){
    b.onclick = function(){ state[b.dataset.k] = b.dataset.v; render(); };
  });
  syncChips();
}
function syncChips(){
  document.querySelectorAll("#filters .chip").forEach(function(b){
    b.setAttribute("aria-pressed", String(state[b.dataset.k] === b.dataset.v));
  });
}

function match(it){
  for (var i=0;i<FKEYS.length;i++){
    var k = FKEYS[i].key, want = state[k];
    if (!want) continue;
    var v = it[k];
    if (Array.isArray(v)) { if (v.indexOf(want) < 0) return false; }
    else if (v !== want) return false;
  }
  var q = state.q.trim().toLowerCase();
  if (!q) return true;
  var hay = [it.name, it.summary, it.subject, it.grade, it.form, it.source,
    (it.tags||[]).join(" "), (it.howto||[]).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
}

function sortFn(a,b){
  if (state.sort === "name") return a.name.localeCompare(b.name,"ko");
  if (state.sort === "subject") return (a.subject||"").localeCompare(b.subject||"","ko") || a.name.localeCompare(b.name,"ko");
  if (state.sort === "updated") return String(b.updated||"").localeCompare(String(a.updated||""));
  return 0;
}

function isNew(it){
  if (!it.updated) return false;
  return (Date.now() - new Date(it.updated).getTime()) < 1000*60*60*24*30;
}

function render(){
  var list = items.filter(match).sort(sortFn);
  document.getElementById("rn").textContent = list.length;
  document.getElementById("rtot").textContent = list.length === items.length ? "" : " / 전체 " + items.length + "건";
  document.getElementById("qx").classList.toggle("on", !!state.q);
  document.getElementById("empty").hidden = list.length > 0;
  syncChips();

  document.getElementById("grid").innerHTML = list.map(function(it){
    var badges = '<span class="b sub">' + esc(it.subject) + '</span>' +
      '<span class="b">' + esc(it.grade) + '</span>' +
      '<span class="b">' + esc(it.form) + '</span>' +
      (isNew(it) ? '<span class="b new">NEW</span>' : '');
    var meta = [];
    if (it.players) meta.push("👥 " + esc(it.players));
    if (it.minutes) meta.push("⏱ " + esc(it.minutes));
    if (it.device && it.device.length) meta.push("🖥 " + it.device.map(esc).join(", "));
    var tags = (it.tags||[]).slice(0,4).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join("");

    var acts = it.downloadable
      ? '<a class="btn pri" href="' + esc(it.file) + '" target="_blank" rel="noopener" data-act="open" data-id="' + esc(it.id) + '">▶ 바로 실행</a>' +
        '<a class="btn" href="' + esc(it.file) + '" download="' + esc(it.id) + '.html" data-act="download" data-id="' + esc(it.id) + '">⬇ 내려받기</a>'
      : '';
    acts += '<button class="btn" data-act="detail" data-id="' + esc(it.id) + '">자세히</button>';

    return '<article class="card' + (it.downloadable ? '' : ' note') + '">' +
      '<div class="badges">' + badges + '</div>' +
      '<div class="cname">' + esc(it.name) + '</div>' +
      '<div class="csum">' + esc(it.summary) + '</div>' +
      (meta.length ? '<div class="meta">' + meta.join("<span aria-hidden=\"true\">|</span>") + '</div>' : '') +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (it.notice ? '<div class="notice">' + esc(it.notice) + '</div>' : '') +
      '<div class="acts">' + acts + '</div>' +
      '</article>';
  }).join("");

  document.querySelectorAll("#grid [data-act]").forEach(function(el){
    el.addEventListener("click", function(){
      var act = el.dataset.act, id = el.dataset.id;
      if (act === "detail") openDetail(id);
      else track(id, act);
    });
  });
}

/* ── 상세 ── */
var sheet = document.getElementById("sheet");
function openDetail(id){
  var it = items.filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  document.getElementById("d-name").textContent = it.name;

  var html = "";
  html += '<div class="sec"><h3>이 자료는</h3><p style="margin:0">' + esc(it.summary) + '</p></div>';
  if (it.howto && it.howto.length){
    html += '<div class="sec"><h3>수업에서 이렇게 씁니다</h3><ul>' +
      it.howto.map(function(h){ return "<li>" + esc(h) + "</li>"; }).join("") + '</ul></div>';
  }
  if (it.support){
    html += '<div class="sec"><h3>참여와 지원</h3><p style="margin:0">' + esc(it.support) + '</p></div>';
  }
  html += '<div class="sec"><h3>기본 정보</h3><dl class="kv">' +
    '<dt>교과</dt><dd>' + esc(it.subject) + '</dd>' +
    '<dt>학년</dt><dd>' + esc(it.grade) + '</dd>' +
    '<dt>인원</dt><dd>' + esc(it.players || "제한 없음") + '</dd>' +
    '<dt>시간</dt><dd>' + esc(it.minutes || "자유") + '</dd>' +
    '<dt>필요 환경</dt><dd>' + esc((it.device||[]).join(", ") || "없음") + '</dd>' +
    '<dt>출처</dt><dd>' + esc(it.source || "-") + '</dd>' +
    '</dl></div>';
  if (it.notice){
    html += '<div class="sec"><div class="notice">' + esc(it.notice) + '</div></div>';
  }
  if (it.downloadable){
    html += '<div class="sec"><div class="sechd"><h3>바로 열기 QR</h3>' +
      '<button class="btn" id="d-qr">QR 만들기</button></div>' +
      '<div id="qr-box" hidden><div id="qr"></div>' +
      '<p style="font-size:.84em;color:var(--dim);margin:.6em 0 0">태블릿 카메라로 찍으면 프로그램이 바로 열립니다.</p></div></div>';
  }
  if (it.prompt){
    html += '<div class="sec"><div class="sechd"><h3>제작 프롬프트</h3>' +
      '<button class="btn pri" id="d-copy">📋 프롬프트 복사</button></div>' +
      '<pre class="prompt" id="d-prompt">' + esc(it.prompt) + '</pre></div>';
  }
  document.getElementById("d-body").innerHTML = html;

  var copyBtn = document.getElementById("d-copy");
  if (copyBtn) copyBtn.onclick = function(){ copyPrompt(it); };
  var qrBtn = document.getElementById("d-qr");
  if (qrBtn) qrBtn.onclick = function(){ makeQR(it, qrBtn); };

  if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open","");
  document.getElementById("d-body").scrollTop = 0;
}
document.getElementById("d-close").onclick = function(){ sheet.close ? sheet.close() : sheet.removeAttribute("open"); };
sheet.addEventListener("click", function(e){ if (e.target === sheet) sheet.close(); });

function copyPrompt(it){
  var text = it.prompt;
  function done(){ toast("프롬프트를 복사했습니다"); track(it.id, "prompt"); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("복사에 실패했습니다. 아래 글을 직접 선택해 주세요"); }
    document.body.removeChild(ta);
  }
}

function makeQR(it, btn){
  var box = document.getElementById("qr-box"), target = document.getElementById("qr");
  var url = new URL(it.file, location.href).href;
  function draw(){
    target.innerHTML = "";
    new QRCode(target, { text:url, width:180, height:180, correctLevel:QRCode.CorrectLevel.M });
    box.hidden = false; btn.disabled = true; btn.textContent = "QR 생성됨";
  }
  if (window.QRCode) return draw();
  btn.disabled = true; btn.textContent = "불러오는 중";
  var srcs = [
    "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
  ];
  (function load(i){
    if (i >= srcs.length){
      btn.disabled = false; btn.textContent = "QR 만들기";
      toast("QR을 만들지 못했습니다. 주소를 직접 복사해 주세요");
      return;
    }
    var s = document.createElement("script");
    s.src = srcs[i];
    s.onload = function(){ window.QRCode ? draw() : load(i+1); };
    s.onerror = function(){ load(i+1); };
    document.head.appendChild(s);
  })(0);
}

/* ── 검색 · 정렬 ── */
var qEl = document.getElementById("q");
qEl.addEventListener("input", function(){ state.q = qEl.value; render(); });
document.getElementById("qx").onclick = function(){ state.q = ""; qEl.value = ""; qEl.focus(); render(); };
document.getElementById("sort").onchange = function(){ state.sort = this.value; render(); };
document.getElementById("reset").onclick = function(){
  state.q = ""; qEl.value = "";
  FKEYS.forEach(function(f){ state[f.key] = ""; });
  document.getElementById("sort").value = state.sort = "default";
  render();
};

/* ── 시작 ── */
initPrefs();
if (window.matchMedia("(max-width:640px)").matches) document.getElementById("fwrap").open = false;
fetch("tools.json", { cache:"no-cache" })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){
    DATA = d; items = d.items || [];
    document.getElementById("org").textContent = d.org || "";
    document.getElementById("foot-org").textContent =
      (d.org ? d.org + "  |  " : "") + "자료 " + items.length + "건  |  갱신 " + (d.generated || "");
    document.title = (d.title || "특수교육 AI 도구함");
    buildFilters();
    render();
  })
  .catch(function(e){
    document.getElementById("grid").innerHTML =
      '<div class="empty">자료 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
    console.error(e);
  });
})();
</script>
