<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>이빨 건강 지키기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;
 background:linear-gradient(160deg,#bfe9ff 0%,#e8f7ff 45%,#fff6e6 100%);color:#16324f;
 min-height:100vh;overflow-x:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;border-radius:18px;
 font-size:20px;padding:14px 22px;transition:transform .12s,box-shadow .12s;
 box-shadow:0 4px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.big{font-size:24px}
.pri{background:#ff7aa2;color:#fff}
.go{background:#36c98e;color:#fff}
.blue{background:#3aa0ff;color:#fff}
.warn{background:#ff9f43;color:#fff}
.ghost{background:#fff;color:#16324f;box-shadow:0 3px 0 #cfe3f2}
input,select{font-family:inherit;font-weight:800;font-size:20px;padding:12px 14px;border-radius:14px;
 border:3px solid #bcd9ef;outline:none;color:#16324f}
input:focus,select:focus{border-color:#3aa0ff}

/* screens */
.screen{display:none;min-height:100vh;padding:20px}
.screen.on{display:block}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}

/* setup */
.card{background:#fff;border-radius:26px;padding:26px;max-width:680px;width:100%;
 box-shadow:0 12px 30px rgba(40,90,140,.18);border:4px solid #ffffff}
.title{font-size:40px;color:#ff6090;text-align:center;text-shadow:2px 2px 0 #fff}
.sub{font-size:20px;text-align:center;color:#3a6d96;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.label{font-size:20px;color:#2c587c;min-width:96px}
.chip{padding:10px 16px;border-radius:14px;background:#eaf5ff;color:#2c587c;border:3px solid #d4e9fb}
.chip.sel{background:#3aa0ff;color:#fff;border-color:#3aa0ff}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.namegrid .ni{display:flex;align-items:center;gap:8px;background:#f4fbff;padding:8px;border-radius:14px}
.namegrid .ni span{font-size:30px}
.namegrid .ni input{flex:1;min-width:0}

/* enter */
#enterStage{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.enterCard{background:#fff;border-radius:30px;padding:30px 44px;font-size:40px;box-shadow:0 12px 30px rgba(40,90,140,.2);
 display:flex;align-items:center;gap:18px;animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-90px) scale(.8)}to{opacity:1;transform:none}}

/* game layout */
#game{display:none;grid-template-columns:1fr 320px;gap:16px;padding:14px;align-items:start}
#game.on{display:grid}
.boardWrap{display:flex;align-items:center;justify-content:center}
#board{position:relative;width:min(82vh,760px);aspect-ratio:1/1;background:#dff1ff;border-radius:20px;
 box-shadow:inset 0 0 0 5px #fff,0 8px 24px rgba(40,90,140,.18)}
.cell{position:absolute;border-radius:12px;border:3px solid rgba(255,255,255,.85);
 display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
 box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cell .ce{font-size:min(3.2vh,30px);line-height:1}
.cell .cn{position:absolute;top:2px;left:5px;font-size:11px;color:rgba(0,0,0,.45)}
.cell.corner{box-shadow:0 4px 10px rgba(0,0,0,.18);border-width:4px}
.tok{position:absolute;font-size:24px;transition:left .25s,top .25s;z-index:5;
 filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));pointer-events:none}
#centerInfo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;text-align:center}
#centerInfo .ct{font-size:min(4.4vh,34px);color:#ff6090;text-shadow:1px 1px 0 #fff}
#turnInfo{font-size:min(2.6vh,22px);color:#2c587c;margin-top:8px}
#curPlayer{font-size:min(3.4vh,28px);margin-top:6px}

/* sidebar */
.side{background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(40,90,140,.14);
 display:flex;flex-direction:column;gap:12px}
.scoreList{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto}
.pl{display:flex;align-items:center;gap:8px;background:#f4fbff;border-radius:14px;padding:8px 10px;font-size:19px}
.pl.act{background:#fff2cc;box-shadow:0 0 0 3px #ffd24d inset}
.pl .av{font-size:26px}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font-size:22px;color:#ff6090}
.pl .cb{font-size:14px;color:#ff8a00}
.rk{font-size:15px;color:#9bb6cb;min-width:20px}

/* dice area */
.diceBox{background:#eef8ff;border-radius:16px;padding:12px;text-align:center}
#diceFace{font-size:64px;height:74px;line-height:74px}
.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gauge{height:18px;border-radius:10px;background:#dde9f2;overflow:hidden;margin:8px 0}
.gauge>div{height:100%;width:0;background:#36c98e;transition:width .08s}
.microw{display:flex;align-items:center;gap:8px;font-size:15px;color:#3a6d96}
input[type=range]{width:100%}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,50,80,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.box{background:#fff;border-radius:26px;max-width:640px;width:100%;overflow:hidden;
 box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.bhead{padding:16px 20px;font-size:26px;color:#fff;display:flex;align-items:center;gap:10px}
.bbody{padding:22px;text-align:center}
.qtext{font-size:26px;line-height:1.4;margin:6px 0 14px}
.qemoji{font-size:96px;margin:6px 0}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:#f1f8ff;color:#16324f;border:3px solid #d4e9fb;border-radius:16px;padding:16px;font-size:22px;
 text-align:left;display:flex;gap:10px;align-items:center}
.opt .num{background:#3aa0ff;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;
 align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.opt.ok{background:#d6f7e6;border-color:#36c98e}
.opt.no{background:#ffe0e0;border-color:#ff6b6b}
.opt.ok .num{background:#36c98e}.opt.no .num{background:#ff6b6b}
.two{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.foodbtn{background:#fff;border:4px solid #d4e9fb;border-radius:22px;padding:18px 14px;min-width:150px;
 display:flex;flex-direction:column;align-items:center;gap:6px;font-size:24px}
.foodbtn .fe{font-size:84px}
.foodbtn.ok{background:#d6f7e6;border-color:#36c98e}
.foodbtn.no{background:#ffe0e0;border-color:#ff6b6b}
.oxwrap{display:flex;gap:20px;justify-content:center}
.oxbtn{border-radius:24px;padding:18px 24px;font-size:30px;border:4px solid;display:flex;
 flex-direction:column;align-items:center;gap:6px;min-width:160px;background:#fff}
.oxbtn .tooth{font-size:60px}
.oxO{border-color:#36c98e;color:#1a9d6b}
.oxX{border-color:#ff6b6b;color:#e23d3d}
.oxbtn.ok{background:#d6f7e6}.oxbtn.no{background:#ffe0e0}
.result{font-size:30px;margin:14px 0;min-height:40px}
.bonus{font-size:22px;color:#ff8a00;margin-top:6px}
.diffbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.diffbtn{border-radius:20px;padding:18px;font-size:24px;color:#16324f;border:4px solid;display:flex;
 align-items:center;gap:14px;justify-content:center;background:#fff}
.diffbtn .st{font-size:18px;opacity:.8}
.d1{border-color:#36c98e;background:#e8fbf2}
.d2{border-color:#ffc83d;background:#fff8e6}
.d3{border-color:#ff7a7a;background:#ffeaea}
.hintbox{background:#fff8e6;border:3px dashed #ffc83d;border-radius:14px;padding:12px;margin:10px 0;
 font-size:20px;color:#a96b00;display:none}
.hintbox.on{display:block}

/* golden card flip */
.flip{perspective:1000px;width:200px;height:260px;margin:10px auto}
.flipInner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.flipInner.done{transform:rotateY(180deg)}
.flipFace{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;
 align-items:center;justify-content:center;font-size:90px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.flipFront{background:linear-gradient(135deg,#ffd84d,#ffb300)}
.flipBack{background:#fff;transform:rotateY(180deg);flex-direction:column;font-size:64px;padding:14px;text-align:center}
.flipBack .bt{font-size:22px;color:#16324f;margin-top:8px}

/* travel buttons */
.travelGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px;max-height:40vh;overflow:auto}
.travelGrid button{padding:8px 0;font-size:16px;border-radius:10px;background:#eaf5ff;color:#2c587c;box-shadow:0 2px 0 #cfe3f2}

/* sparkle / confetti */
.spark{position:fixed;font-size:28px;pointer-events:none;z-index:60;animation:up 1s ease forwards}
@keyframes up{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-90px) scale(1.6)}}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:60}
.rankList{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rankItem{display:flex;align-items:center;gap:12px;background:#f4fbff;border-radius:16px;padding:12px 16px;font-size:24px}
.medal{font-size:34px}
@media(max-width:900px){#game.on{grid-template-columns:1fr}.side{order:-1}}
</style>
</head><body>

<!-- ========== SETUP ========== -->
<div id="setup" class="screen on center">
 <div class="card">
  <div class="title">🦷 이빨 건강 지키기 🪥</div>
  <div class="sub">치아에 좋은 음식 · 좋지 않은 음식 알기</div>
  <div class="row"><span class="label">👥 인원수</span>
   <div id="numChips"></div></div>
  <div id="nameArea" class="namegrid"></div>
  <div class="row"><span class="label">🔁 턴 수</span>
   <div id="turnChips"></div></div>
  <div class="row" style="margin-top:16px;background:#fff8e6;border-radius:16px;padding:12px;font-size:18px;color:#a96b00;display:block">
   💡 퀴즈 칸(🦷)에 도착하면 그때 <b>🟢어려움·🟡보통·🔴쉬움</b> 난이도를 직접 골라요!<br>
   어떤 난이도든 정답이면 <b>1점 + 🎁랜덤 보너스</b>를 받아요.
  </div>
  <div class="center" style="margin-top:18px">
   <button class="pri big" onclick="startEnter()">선수 입장하기 ▶</button>
  </div>
 </div>
</div>

<!-- ========== ENTER ========== -->
<div id="enterScreen" class="screen center">
 <div id="enterStage"></div>
 <div id="enterCtrl" class="center">
  <div style="font-size:26px;color:#2c587c">준비되었나요?</div>
  <button class="go big" onclick="beginGame()">🎮 게임 시작!</button>
 </div>
</div>

<!-- ========== GAME ========== -->
<div id="game" class="screen">
 <div class="boardWrap">
  <div id="board">
   <div id="centerInfo">
    <div class="ct">🦷 이빨 건강 지키기</div>
    <div id="curPlayer"></div>
    <div id="turnInfo"></div>
   </div>
  </div>
 </div>
 <div class="side">
  <div class="diceBox">
   <div id="diceFace">🎲</div>
   <button id="rollBtn" class="pri big" style="width:100%" onclick="rollDice()">🎲 주사위 굴리기</button>
   <div style="margin-top:10px">
    <button id="micBtn" class="ghost" style="width:100%;font-size:17px" onclick="toggleMic()">🎤 마이크로 굴리기 OFF</button>
    <div class="gauge"><div id="gaugeBar"></div></div>
    <div class="microw"><span>←예민</span><input id="thr" type="range" min="50" max="220" value="160"><span>둔감→</span></div>
   </div>
  </div>
  <div class="scoreList" id="scoreList"></div>
  <button class="warn" style="font-size:18px" onclick="askEnd()">⏹ 게임 끝내기</button>
 </div>
</div>

<!-- ========== MODALS ========== -->
<div id="modal" class="modal"><div class="box">
 <div id="mhead" class="bhead"></div>
 <div id="mbody" class="bbody"></div>
</div></div>

<div id="result" class="screen center">
 <div class="card">
  <div class="title">🎉 게임 끝! 🎉</div>
  <div id="rankList" class="rankList"></div>
  <div class="center" style="margin-top:20px">
   <button class="pri big" onclick="location.reload()">🔄 다시 하기</button>
  </div>
 </div>
</div>

<script>

// ===== AUDIO =====
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f,d,type,vol){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
 o.type=type||'sine'; o.frequency.value=f; g.gain.value=vol||.18; o.connect(g); g.connect(a.destination);
 const t=a.currentTime; o.start(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.exponentialRampToValueAtTime(.001,t+(d||.15)); o.stop(t+(d||.15)); }
function sfxStep(){beep(520,.08,'square',.12);}
function sfxRoll(){beep(300,.05,'sawtooth',.1);}
function sfxGood(){beep(660,.12,'sine',.2);setTimeout(()=>beep(880,.16,'sine',.2),120);setTimeout(()=>beep(1100,.2,'sine',.18),260);}
function sfxBad(){beep(300,.2,'sawtooth',.16);setTimeout(()=>beep(200,.25,'sawtooth',.14),160);}
function sfxStar(){beep(900,.06,'sine',.16);setTimeout(()=>beep(1300,.1,'sine',.16),70);}
function sfxBom(){beep(160,.3,'triangle',.2);}
function sfxFan(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sine',.2),i*140));}
function sfxThrob(){beep(180,.12,'sine',.18);setTimeout(()=>beep(180,.12,'sine',.18),260);}

// ===== BOARD BUILD =====
const QUIZCAT={emoji:'🦷',bg:'#cdeaff'};
function buildBoard(){
 CELLS=new Array(40);
 CELLS[0]={t:'start',emoji:'🚩',bg:'#ffe3a3'};
 CELLS[10]={t:'island',emoji:'🏝️',bg:'#a3e3ff'};
 CELLS[20]={t:'travel',emoji:'✈️',bg:'#ffc1d6'};
 CELLS[30]={t:'lucky',emoji:'🎰',bg:'#d9b3ff'};
 [5,15,25,35,22].forEach(g=>CELLS[g]={t:'gold',emoji:'🔑',bg:'#ffe680'});
 const quizColors=['#cdebff','#ffe0ec','#e3f7d4','#fff1c2','#e6e0ff','#d4f5ef'];
 const quizEmojis=['🦷','🍎','🪥','🥦','💧','😁'];
 let ci=0;
 for(let i=0;i<40;i++){ if(CELLS[i])continue;
  CELLS[i]={t:'quiz',emoji:quizEmojis[ci%quizEmojis.length],bg:quizColors[ci%quizColors.length]}; ci++; }
 layoutBoard();
}
// grid position for cell index (11x11 perimeter)
function cellRC(i){
 if(i<=10)return{r:0,c:i};            // top L->R 0..10
 if(i<=19)return{r:i-10,c:10};        // right top->down 11..19
 if(i<=30)return{r:10,c:30-i};        // bottom R->L 20..30
 return{r:40-i,c:0};                  // left bottom->up 31..39
}
function layoutBoard(){
 const bd=document.getElementById('board'); [...bd.querySelectorAll('.cell,.tok')].forEach(e=>e.remove());
 for(let i=0;i<40;i++){
  const {r,c}=cellRC(i); const cell=document.createElement('div');
  const corner=(i===0||i===10||i===20||i===30);
  cell.className='cell'+(corner?' corner':''); cell.id='cell'+i;
  cell.style.background=CELLS[i].bg;
  const u=100/11;
  cell.style.left=(c*u)+'%'; cell.style.top=(r*u)+'%';
  cell.style.width=u+'%'; cell.style.height=u+'%';
  cell.innerHTML='<span class="cn">'+i+'</span><span class="ce">'+CELLS[i].emoji+'</span>';
  bd.appendChild(cell);
 }
 G.players.forEach((p,idx)=>{ const t=document.createElement('div');t.className='tok';t.id='tok'+idx;t.textContent=p.ava;bd.appendChild(t);});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{G.players.forEach((p,i)=>placeTok(i));}));
}
function getCellPx(pos){
 const {r,c}=cellRC(pos%40); const bd=document.getElementById('board'); const w=bd.clientWidth; const u=w/11;
 return {x:c*u+u/2, y:r*u+u/2};
}
function placeTok(idx){
 const p=G.players[idx]; const t=document.getElementById('tok'+idx); if(!t)return;
 const {x,y}=getCellPx(p.pos%40);
 // spread multiple tokens on same cell
 const same=G.players.filter(q=>q.pos%40===p.pos%40); const k=same.indexOf(p);
 const off=(k-(same.length-1)/2)*14;
 t.style.left=(x+off-12)+'px'; t.style.top=(y-12)+'px';
}

// ===== GAME FLOW =====
function beginGame(){ show('game'); document.getElementById('game').classList.add('on');
 buildBoard(); G.cur=0; G.turn=1; G.busy=false; updateSide(); updateCenter(); }
function show(id){ ['setup','enterScreen','game','result'].forEach(s=>{const e=document.getElementById(s);e.classList.toggle('on',s===id);}); }
function updateCenter(){
 const p=G.players[G.cur];
 document.getElementById('curPlayer').innerHTML='지금은 '+p.ava+' <b>'+esc(p.name)+'</b> 차례!';
 document.getElementById('turnInfo').textContent='🔁 '+G.turn+' / '+G.turns+' 턴';
}
function updateSide(){
 const order=[...G.players].map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score||(b.p.pos-a.p.pos));
 const rankOf={}; order.forEach((o,r)=>rankOf[o.i]=r+1);
 const sl=document.getElementById('scoreList'); sl.innerHTML='';
 G.players.forEach((p,i)=>{const d=document.createElement('div');d.className='pl'+(i===G.cur?' act':'');
  d.innerHTML='<span class="rk">'+rankOf[i]+'위</span><span class="av">'+p.ava+'</span>'+
   '<span class="nm">'+esc(p.name)+'</span>'+(p.combo>=2?'<span class="cb">🔥'+p.combo+'</span>':'')+
   '<span class="sc">'+p.score+'</span>';
  sl.appendChild(d);});
}
function nextTurn(){
 G.busy=false;
 let guard=0;
 do{
  G.cur++;
  if(G.cur>=G.players.length){G.cur=0;G.turn++;}
  if(G.turn>G.turns){endGame();return;}
  guard++;
  if(G.players[G.cur].skip){ G.players[G.cur].skip=false; toast(G.players[G.cur].ava+' 한 턴 쉬어요 😴'); }
  else break;
 }while(guard<100);
 if(G.turn>G.turns){endGame();return;}
 updateCenter(); updateSide();
}

// ===== DICE =====
function rollDice(){ if(G.busy)return; G.busy=true; ac();
 const face=document.getElementById('diceFace'); face.classList.add('spin');
 let n=0,c=0; const iv=setInterval(()=>{n=1+Math.floor(Math.random()*6);face.textContent=DICE[n];sfxRoll();
  if(++c>10){clearInterval(iv);face.classList.remove('spin');face.textContent=DICE[n];sfxStar();
   setTimeout(()=>movePlayer(n),350);}},70);
}
function movePlayer(steps){
 const p=G.players[G.cur]; let left=steps;
 (function st(){
  if(left<=0){ setTimeout(()=>onLand(),250); return; }
  p.pos++; left--; sfxStep();
  if(p.pos%40===0){ p.score++; passStart(); updateSide(); }
  placeTok(G.cur);
  setTimeout(st,260);
 })();
}
function passStart(){ const bd=document.getElementById('board'); sparkAt(getCellPx(0),'✨'); }

// ===== ON LAND =====
function onLand(){
 const p=G.players[G.cur]; const cell=CELLS[p.pos%40];
 if(cell.t==='start'){ toast('🚩 출발 통과! +1점'); updateSide(); endStep(); }
 else if(cell.t==='island'){ p.skip=true; modalSimple('🏝️ 무인도','#3aa0ff','🏝️','무인도에 갇혔어요!<br>다음 턴은 한 번 쉬어요 😴',endStep); }
 else if(cell.t==='travel'){ openTravel(); }
 else if(cell.t==='lucky'){ openLucky(); }
 else if(cell.t==='gold'){ openGold(); }
 else if(cell.t==='quiz'){ openDiff(); }
}
function endStep(){ closeModal(); nextTurn(); }

function toast(msg){ const t=document.createElement('div');t.className='spark';t.style.left='50%';t.style.top='30%';
 t.style.fontSize='22px';t.style.background='#16324f';t.style.color='#fff';t.style.padding='10px 16px';t.style.borderRadius='14px';
 t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1000); }

 for(let i=0;i<6;i++){const s=document.createElement('div');s.className='spark';s.textContent=em||'✨';
  s.style.left=(bd.left+pt.x+(Math.random()*40-20))+'px';s.style.top=(bd.top+pt.y+(Math.random()*30-15))+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);} sfxStar(); }

function draw(level){ if(pools[level].length===0){ const src=level===1?S1:level===2?S2:S3;
  pools[level]=src.map((_,i)=>i); for(let i=pools[level].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pools[level][i],pools[level][j]]=[pools[level][j],pools[level][i]];} }
 return pools[level].pop(); }
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function toggleHint(){document.getElementById('hint').classList.toggle('on');}
function answer(ok,btn,ow,correctLabel,order){
 [...ow.children].forEach(b=>b.onclick=null);
 const p=G.players[G.cur];
 if(ok){
  btn.classList.add('ok'); sfxGood();
  p.combo++; let gain=1; const bonus=Math.floor(Math.random()*3); gain+=bonus;
  let comboB=0; if(p.combo>=2){comboB=1;gain+=1;}
  p.score+=gain;
  let msg='🎉 정답! +'+gain+'점';
  let extra='';
  if(bonus>0)extra+='<div class="bonus">🎁 행운 보너스 +'+bonus+'점!</div>';
  if(comboB>0)extra+='<div class="bonus">🔥 '+p.combo+'연속 콤보 +1점!</div>';
  document.getElementById('res').innerHTML='<div style="color:#1a9d6b">'+msg+'</div>'+extra;
  sparkAt(getCellPx(p.pos),'🎉');
 }else{
  btn.classList.add('no'); sfxBad(); p.combo=0;
  // reveal correct
  if(order){ [...ow.children].forEach((b,i)=>{ if(order[i].ok)b.classList.add('ok'); }); }
  else{ [...ow.children].forEach(b=>{ if(b!==btn)b.classList.add('ok'); }); }
  document.getElementById('res').innerHTML='<div style="color:#e23d3d">😊 아쉬워요! 정답은 '+correctLabel+(typeof correctLabel==='number'?'번':'')+' 이에요</div>';
 }
 updateSide();
 const r=document.getElementById('res');
 const nb=document.createElement('button');nb.className='go big';nb.style.marginTop='12px';nb.textContent='확인 ▶ 다음';
 nb.onclick=endStep; r.appendChild(nb);
}

function travelTo(target,base){
 const p=G.players[G.cur]; const cur=base%40;
 let fwd=(target-cur+40)%40; if(fwd===0)fwd=40; // at least move
 closeModal();
 let left=fwd;
 (function st(){ if(left<=0){setTimeout(onLand,250);return;}
  p.pos++;left--;sfxStep(); if(p.pos%40===0){p.score++;passStart();updateSide();}
  placeTok(G.cur); setTimeout(st,200); })();
}

 placeTok(G.cur); }

// ===== MIC =====
let micOn=false,micStream=null,analyser=null,micRAF=null,cooldown=false,micData=null;
async function toggleMic(){
 if(micOn){ stopMic(); return; }
 try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const a=ac(); const src=a.createMediaStreamSource(micStream);
  analyser=a.createAnalyser(); analyser.fftSize=2048; micData=new Uint8Array(analyser.fftSize);
  src.connect(analyser); micOn=true;
  document.getElementById('micBtn').textContent='🎤 마이크로 굴리기 ON'; document.getElementById('micBtn').classList.remove('ghost');document.getElementById('micBtn').classList.add('go');
  document.getElementById('rollBtn').style.display='none';
  micLoop();
 }catch(e){ alert('마이크를 사용할 수 없어요. 버튼으로 주사위를 굴려요! 🎲'); document.getElementById('rollBtn').style.display=''; }
}
function stopMic(){ micOn=false; if(micRAF)cancelAnimationFrame(micRAF);
 if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
 document.getElementById('micBtn').textContent='🎤 마이크로 굴리기 OFF';document.getElementById('micBtn').classList.add('ghost');document.getElementById('micBtn').classList.remove('go');
 document.getElementById('rollBtn').style.display=''; document.getElementById('gaugeBar').style.width='0%'; }
function micLoop(){
 if(!micOn)return;
 analyser.getByteTimeDomainData(micData);
 let peak=0; for(let i=0;i<micData.length;i++){const v=Math.abs(micData[i]-128);if(v>peak)peak=v;}
 const pct=Math.min(100,peak/128*100); const bar=document.getElementById('gaugeBar');
 bar.style.width=pct+'%'; bar.style.background=pct>70?'#ff4d4d':pct>40?'#ffb300':'#36c98e';
 const thr=+document.getElementById('thr').value;     // 50~220
 const need=thr/2;                                     // deviation 25~110
 if(!cooldown && !G.busy && peak>=need){
  cooldown=true; setTimeout(()=>{cooldown=false;},2000);
  rollDice();
 }
 micRAF=requestAnimationFrame(micLoop);
}
