<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아이스크림 클레이 메뉴판</title>
<style>
  *{box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Arial Rounded MT Bold','Pretendard','맑은 고딕',sans-serif; background:#ffe5ef; color:#5b3424; overflow:hidden;}
  .app{width:100vw; height:100vh; padding:18px; background:radial-gradient(circle at 20% 15%,#fff8fb 0 15%,transparent 35%),linear-gradient(180deg,#ffd7e7,#fff7f1); position:relative;}
  .awning{position:absolute; inset:0 0 auto 0; height:86px; background:repeating-linear-gradient(90deg,#ff8fb8 0 72px,#fff1f7 72px 144px); border-bottom:8px solid #ffc1d7; border-radius:0 0 40px 40px; opacity:.9;}
  h1{position:relative; z-index:1; margin:18px auto 14px; width:max-content; padding:10px 42px; border-radius:38px; background:#fff; color:#ff4f93; font-size:44px; text-shadow:3px 3px 0 #fff0f6; border:4px dashed #ff92bd; box-shadow:0 8px 0 #ffc4d9;}
  .layout{position:relative; z-index:2; height:calc(100vh - 130px); display:grid; grid-template-columns:260px 1fr 260px; gap:22px; max-width:1420px; margin:0 auto;}
  .panel{background:rgba(255,255,255,.86); border:5px solid #ffbdd4; border-radius:28px; box-shadow:0 8px 18px rgba(255,119,165,.24);}
  .menu{padding:18px 14px; display:flex; flex-direction:column; justify-content:space-around; gap:14px;}
  .flavorBtn{height:132px; border:4px dashed; border-radius:24px; background:#fffafb; display:flex; align-items:center; gap:12px; padding:8px 10px; cursor:pointer; transition:.15s; font-size:30px; font-weight:900; box-shadow:0 5px 0 rgba(0,0,0,.07);}
  .flavorBtn span{white-space:nowrap; word-break:keep-all; letter-spacing:-1px; flex:1; text-align:left;}
  .flavorBtn:active,.flavorBtn.active{transform:scale(.97); background:#fff1f7;}
  .flavorBtn .miniIce{width:86px; height:106px; flex:0 0 auto;}
  .strawberry{color:#ff4f93; border-color:#ff6aa4}.melon{color:#66b957; border-color:#81c76e}.choco{color:#7b4126; border-color:#b87951}.vanilla{color:#e7a816; border-color:#ffd045}
  .main{padding:18px 26px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-width:0;}
  .cardTitle{width:330px; min-height:285px; color:#ff4f93; padding:14px 18px 18px; border-radius:28px; border:4px dashed #ff92bd; background:#fff1f7; margin-bottom:14px; font-weight:900; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 0 rgba(255,143,184,.22);}
  .cardTitle .miniIce{width:170px; height:205px;}
  .flavorNameBox{display:block; width:220px; padding:7px 12px 9px; border-radius:18px; background:#fff; border:3px solid #ffc1d7; text-align:center; font-size:46px; line-height:1.05; white-space:nowrap; word-break:keep-all; letter-spacing:-2px;}
  .bigIce{width:170px; height:205px; margin-bottom:6px;}
  .guide{font-size:27px; font-weight:900; margin:4px 0 16px; padding:10px 22px; border-radius:20px; background:#fff6cf; color:#7b4126;}
  .equation{width:100%; max-width:820px; display:grid; grid-template-columns:1fr 70px 1fr 70px 1fr; align-items:center; gap:12px;}
  .slot{height:190px; border:5px dashed #ff82b1; border-radius:28px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; box-shadow:inset 0 0 0 10px #fff8fb;}
  .slot .hintCircle{width:98px; height:98px; border:4px dashed #cfc7c3; border-radius:50%; background:#fffafc; display:flex; align-items:center; justify-content:center;}
  .slot .caption{margin-top:12px; font-size:24px; font-weight:900; color:#9a8a83;}
  .slot.filled .caption{color:#444}.symbol{text-align:center; font-size:72px; font-weight:900; color:#ff5798;}
  .ball{width:96px; height:96px; border-radius:50%; border:3px solid rgba(255,255,255,.8); box-shadow:inset -12px -14px 0 rgba(0,0,0,.10), inset 10px 10px 0 rgba(255,255,255,.28), 0 5px 8px rgba(0,0,0,.14); display:inline-block;}
  .palette{padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:center;}
  .paletteTitle{grid-column:1/-1; text-align:center; color:#ff4f93; font-size:30px; font-weight:900; padding:8px; background:#fff1f7; border:3px dashed #ff8db9; border-radius:20px;}
  .colorBtn{height:106px; border:4px dashed #ff9fc2; border-radius:22px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; gap:5px; font-size:21px; font-weight:900;}
  .colorBtn:active{transform:scale(.95)}
  .colorBtn .ball{width:64px;height:64px;}
  .red{background:#ef3034}.white{background:#f7f5ef}.green{background:#2fb95b}.orange{background:#ff8b22}.blue{background:#1689e8}.yellow{background:#ffd729}.pink{background:#ff81b2}.brown{background:#9a5a2b}
  .stamp{position:absolute; inset:0; background:rgba(255,246,251,.88); display:none; align-items:center; justify-content:center; flex-direction:column; border-radius:24px; z-index:10;}
  .stamp.show{display:flex; animation:pop .35s ease-out;}
  .stampText{font-size:62px; font-weight:900; color:#ff3b87; text-shadow:3px 3px 0 #fff;}
  .confetti{position:absolute; font-size:38px; animation:boom 1.1s ease-out forwards;}
  @keyframes pop{from{transform:scale(.8);opacity:.2}to{transform:scale(1);opacity:1}}
  @keyframes boom{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(1.3);opacity:0}}
  .footer{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:#fff; border:3px dashed #ff9fc2; border-radius:20px; padding:9px 28px; color:#7b4126; font-size:22px; font-weight:900; z-index:3;}
  svg{overflow:visible}.cone{fill:#d98a32}.waffle{stroke:#a65d20; stroke-width:4}.scoop{filter:drop-shadow(0 5px 3px rgba(0,0,0,.14))}.deco{position:absolute; font-size:28px; opacity:.8;}
</style>
</head>
<body>
<div class="app">
  <div class="awning"></div>
  <span class="deco" style="left:4%;top:18%">⭐</span><span class="deco" style="right:5%;top:18%">💗</span><span class="deco" style="left:8%;bottom:10%">🍬</span><span class="deco" style="right:8%;bottom:10%">🎈</span>
  <h1>🍦 아이스크림 메뉴판 🍦</h1>
  <div class="layout">
    <div class="panel menu" id="menu"></div>
    <main class="panel main" id="main"></main>
    <aside class="panel palette" id="palette"><div class="paletteTitle">색깔 팔레트</div></aside>
  </div>
  <div class="footer">왼쪽에서 맛을 고르고, 오른쪽 색깔을 차례대로 눌러요!</div>
</div>
<script>
const flavors={
 strawberry:{name:'딸기맛', cls:'strawberry', scoop:'#ff8ab4', deco:'#e93b55', need:['red','white'], result:'pink', colors:['빨강','흰색'], fruit:'strawberry'},
 melon:{name:'메론맛', cls:'melon', scoop:'#9be36c', deco:'#62bd47', need:['green','white'], result:'green', colors:['초록','흰색'], fruit:'melon'},
 choco:{name:'초코맛', cls:'choco', scoop:'#8b4a25', deco:'#5d2e16', need:['orange','blue'], result:'brown', colors:['주황','파랑'], fruit:'choco'},
 vanilla:{name:'바닐라맛', cls:'vanilla', scoop:'#ffe6a6', deco:'#f1c33b', need:['yellow','white'], result:'yellow', colors:['노랑','흰색'], fruit:'vanilla'}
};
const colorNames={red:'빨강',white:'흰색',green:'초록',orange:'주황',blue:'파랑',yellow:'노랑',pink:'분홍',brown:'갈색'};
const paletteColors=['red','orange','yellow','green','blue','white','pink','brown'];
let selected='strawberry', step=0, placed=[];
function iceSvg(f, size='mini'){
 const fl=flavors[f];
 const top = fl.fruit==='melon'?'<path d="M36 28 C54 2 82 0 106 25" fill="none" stroke="#77c93b" stroke-width="10" stroke-linecap="round"/><path d="M54 26 C65 14 82 12 96 26" fill="none" stroke="#fff68a" stroke-width="5" stroke-linecap="round"/>': fl.fruit==='choco'?'<rect x="78" y="8" width="42" height="48" rx="5" fill="#6b3218" transform="rotate(35 99 32)"/><path d="M83 26 h38 M101 12 v44" stroke="#9b5d38" stroke-width="4" transform="rotate(35 99 32)"/>': fl.fruit==='vanilla'?'<ellipse cx="62" cy="28" rx="18" ry="12" fill="#fff7c8"/><path d="M60 14 C68 4 76 6 72 20" stroke="#6d3519" stroke-width="6" fill="none" stroke-linecap="round"/>':'<path d="M69 17 C82 3 102 12 96 31 C91 48 66 40 62 27 C59 20 62 17 69 17" fill="#ee3344"/><circle cx="74" cy="24" r="2" fill="#fff6ae"/><circle cx="85" cy="30" r="2" fill="#fff6ae"/><path d="M76 12 C82 3 91 8 86 17 M76 12 C68 7 64 14 72 18" stroke="#2aa44f" stroke-width="6" fill="none" stroke-linecap="round"/>';
 return `<svg class="${size==='big'?'bigIce':'miniIce'}" viewBox="0 0 140 170" aria-hidden="true"><path class="cone" d="M40 82 L100 82 L72 164 Z"/><path class="waffle" d="M47 98 L90 138 M58 86 L101 125 M93 98 L50 138 M82 86 L39 125" fill="none"/><circle class="scoop" cx="70" cy="70" r="48" fill="${fl.scoop}"/><circle cx="44" cy="105" r="12" fill="${fl.scoop}"/><circle cx="64" cy="110" r="13" fill="${fl.scoop}"/><circle cx="87" cy="105" r="12" fill="${fl.scoop}"/><circle cx="50" cy="58" r="5" fill="${fl.deco}"/><circle cx="83" cy="50" r="5" fill="${fl.deco}"/><circle cx="96" cy="75" r="4" fill="${fl.deco}"/>${top}</svg>`;
}
function renderMenu(){
 const menu=document.getElementById('menu'); menu.innerHTML='';
 Object.keys(flavors).forEach(k=>{const b=document.createElement('button'); b.className=`flavorBtn ${flavors[k].cls} ${selected===k?'active':''}`; b.innerHTML=iceSvg(k)+`<span>${flavors[k].name}</span>`; b.onclick=()=>{selected=k; step=0; placed=[]; renderAll();}; menu.appendChild(b);});
}
function slot(i){const f=flavors[selected]; const filled=placed[i]; return `<div class="slot ${filled?'filled':''}" id="slot${i}">${filled?`<span class="ball ${filled}"></span><div class="caption">${colorNames[filled]}</div>`:`<div class="hintCircle"><span class="ball ${f.need[i]}" style="width:58px;height:58px;opacity:.38"></span></div><div class="caption">같은 색을 눌러요</div>`}</div>`}
function renderMain(){const f=flavors[selected]; document.getElementById('main').innerHTML=`<div class="stamp" id="stamp"><div class="stampText">🎉 축하합니다! 🎉</div></div><div class="cardTitle">${iceSvg(selected)}<div class="flavorNameBox">${f.name}</div></div><div class="guide"><span class="ball ${f.need[0]}" style="width:38px;height:38px;vertical-align:middle"></span> + <span class="ball ${f.need[1]}" style="width:38px;height:38px;vertical-align:middle"></span> 이 필요해요!</div><div class="equation">${slot(0)}<div class="symbol">+</div>${slot(1)}<div class="symbol">=</div><div class="slot filled"><span class="ball ${f.result}"></span><div class="caption">완성 색</div></div></div>`;}
function renderPalette(){const p=document.getElementById('palette'); p.innerHTML='<div class="paletteTitle">색깔 팔레트</div>'; paletteColors.forEach(c=>{const btn=document.createElement('button'); btn.className='colorBtn'; btn.innerHTML=`<span class="ball ${c}"></span><span>${colorNames[c]}</span>`; btn.onclick=()=>pick(c); p.appendChild(btn);});}
function pick(c){const f=flavors[selected]; if(c===f.need[step]){placed[step]=c; step++; renderMain(); if(step>=2) celebrate();} else {navigator.vibrate&&navigator.vibrate(80);}}
function celebrate(){const st=document.getElementById('stamp'); st.classList.add('show'); const marks=['🎈','🎊','⭐','💗','🍦','✨','🎉','🌈']; for(let i=0;i<36;i++){const s=document.createElement('span'); s.className='confetti'; s.textContent=marks[i%marks.length]; s.style.setProperty('--x',(Math.random()*700-350)+'px'); s.style.setProperty('--y',(Math.random()*-420-40)+'px'); s.style.left='50%'; s.style.top='58%'; st.appendChild(s);} setTimeout(()=>st.classList.remove('show'),1800);}
function renderAll(){renderMenu(); renderMain(); renderPalette();}
renderAll();
</script>
</body>
</html>
