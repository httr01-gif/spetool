<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리나라 시와 도 보드게임</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:linear-gradient(160deg,#cfeeff,#eaf7ff 60%,#fff);color:#1f2d3d;min-height:100vh;font-weight:700;}
.hidden{display:none!important;}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;border-radius:16px;font-size:20px;transition:transform .08s;}
button:active{transform:scale(.95);}
.big-btn{background:#ff8a3d;color:#fff;padding:16px 34px;font-size:24px;box-shadow:0 5px 0 #d96a1e;}
.big-btn:hover{background:#ff9a55;}

/* ===== 설정 화면 ===== */
#setup{max-width:760px;margin:0 auto;padding:26px 18px 60px;}
#setup h1{font-size:34px;text-align:center;color:#1769aa;margin-bottom:8px;}
#setup .sub{text-align:center;font-size:18px;color:#4a6;margin-bottom:22px;}
.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 6px 18px rgba(70,130,180,.15);}
.card h2{font-size:22px;color:#1769aa;margin-bottom:14px;}
.pl-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pl-row .em{font-size:34px;width:46px;text-align:center;}
.pl-row input{flex:1;font-size:20px;font-weight:700;padding:12px 14px;border:3px solid #cfe6f5;border-radius:14px;}
.pl-row input:focus{outline:none;border-color:#5bb4ec;}
.del{background:#ffd0d0;color:#c0392b;padding:10px 16px;font-size:18px;}
.addbtn{background:#d9f0ff;color:#1769aa;padding:12px 20px;font-size:19px;width:100%;}
.turn-grid{display:flex;flex-wrap:wrap;gap:10px;}
.turn-grid button{background:#eef5fb;color:#345;padding:12px 18px;font-size:20px;min-width:64px;}
.turn-grid button.on{background:#5bb4ec;color:#fff;box-shadow:0 4px 0 #2f8fd0;}
.center{text-align:center;}

/* ===== 입장 화면 ===== */
#intro{position:fixed;inset:0;background:linear-gradient(160deg,#1769aa,#2f8fd0);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:40;}
#introCard{font-size:120px;animation:slidein .6s ease;}
@keyframes slidein{from{transform:translateX(-120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
#introName{font-size:46px;margin-top:6px;}
#introMsg{font-size:26px;margin-top:18px;opacity:.9;}
.rulebox{background:rgba(255,255,255,.16);border-radius:18px;padding:18px 24px;margin-top:24px;font-size:19px;line-height:1.7;max-width:540px;}

/* ===== 게임 화면 ===== */
#game{display:flex;gap:16px;padding:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
#board{position:relative;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:3px;width:min(92vw,660px);height:min(92vw,660px);background:#bfe3ff;border-radius:18px;padding:8px;box-shadow:0 8px 22px rgba(70,130,180,.25);}
.cell{border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;line-height:1.05;padding:2px;overflow:hidden;border:2px solid rgba(255,255,255,.6);}
.cell .ce{font-size:21px;}
.cell .cn{position:absolute;top:1px;left:3px;font-size:9px;color:rgba(0,0,0,.4);}
.cell{position:relative;}
.corner{font-size:13px;}
.corner .ce{font-size:30px;}
.center-area{grid-column:2 / 11;grid-row:2 / 11;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;}
.center-area h2{font-size:clamp(16px,3.4vw,26px);color:#1769aa;}
.center-area .turninfo{font-size:clamp(13px,2.6vw,18px);color:#567;margin-top:8px;}
.center-area .nowp{font-size:clamp(20px,5vw,40px);margin-top:6px;}
.token{position:absolute;font-size:24px;transition:left .25s,top .25s;z-index:10;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));pointer-events:none;}

/* ===== 사이드바 ===== */
#side{width:min(92vw,300px);display:flex;flex-direction:column;gap:12px;}
.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 5px 16px rgba(70,130,180,.15);}
.panel h3{font-size:18px;color:#1769aa;margin-bottom:8px;}
.rank-row{display:flex;align-items:center;gap:8px;font-size:18px;padding:6px 4px;border-radius:10px;}
.rank-row.me{background:#fff4d9;}
.rank-row .em{font-size:24px;}
.rank-row .nm{flex:1;}
.rank-row .sc{font-weight:900;color:#e67e22;}
.combo{font-size:16px;color:#e74c3c;}
.dice-area{text-align:center;}
#diceFace{font-size:70px;margin:6px 0;}
.gauge{height:18px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 0;}
.gauge>div{height:100%;width:0;background:#2ecc71;transition:width .05s;}
.mic-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.mic-btns button{padding:10px 14px;font-size:16px;background:#eef5fb;color:#345;}
.mic-btns button.on{background:#5bb4ec;color:#fff;}
.thr{display:flex;align-items:center;gap:8px;font-size:13px;color:#678;margin-top:6px;}
.thr input{flex:1;}
.endbtn{background:#ffe0e0;color:#c0392b;padding:12px;font-size:17px;width:100%;}

/* ===== 팝업 ===== */
.overlay{position:fixed;inset:0;background:rgba(20,40,60,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:24px;max-width:540px;width:100%;padding:24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .25s ease;}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.qhead{border-radius:16px;padding:12px;font-size:24px;color:#222;margin-bottom:16px;}
.qtext{font-size:26px;margin:10px 0 20px;line-height:1.4;}
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{background:#eef5fb;color:#234;padding:16px;font-size:22px;text-align:left;border:3px solid transparent;}
.opt .num{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;background:#5bb4ec;color:#fff;border-radius:50%;margin-right:10px;font-size:18px;}
.opt.correct{background:#d6f5d6;border-color:#2ecc71;}
.opt.wrong{background:#ffd6d6;border-color:#e74c3c;}
.result{font-size:26px;margin:16px 0;}
.modal .em-big{font-size:80px;margin:6px 0;}
.modal h2{font-size:30px;color:#1769aa;margin-bottom:8px;}
.modal p{font-size:20px;color:#456;margin:8px 0;}
.travel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:300px;overflow:auto;margin:14px 0;}
.travel-grid button{background:#eef5fb;color:#234;padding:10px 4px;font-size:16px;}

/* 황금열쇠 카드 */
.flip{width:160px;height:200px;margin:14px auto;perspective:800px;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d;}
.flip.go .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:70px;}
.flip-front{background:#ffd54a;color:#a06800;}
.flip-back{background:#fff;border:4px solid #ffd54a;transform:rotateY(180deg);flex-direction:column;font-size:20px;color:#345;padding:10px;}
.flip-back .be{font-size:54px;margin-bottom:6px;}

/* 폭죽 */
.confetti{position:fixed;width:12px;height:12px;top:-20px;z-index:60;border-radius:3px;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2;}}
.spark{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,150,.9),transparent 60%);border-radius:50%;animation:sp .6s ease;pointer-events:none;}
@keyframes sp{from{transform:scale(.2);opacity:1;}to{transform:scale(2.2);opacity:0;}}
@media(max-width:720px){#game{flex-direction:column;align-items:center;}}
</style>
</head>
<body>

<!-- 설정 화면 -->
<div id="setup">
  <h1>🗺️ 우리나라 시와 도 보드게임</h1>
  <div class="sub">사회 4단원 · 우리나라 행정구역</div>

  <div class="card">
    <h2>👥 선수 이름을 적어요 (2~10명)</h2>
    <div id="players"></div>
    <button class="addbtn" id="addBtn">➕ 선수 추가</button>
  </div>

  <div class="card">
    <h2>🔄 몇 턴 할까요?</h2>
    <div class="turn-grid" id="turnGrid"></div>
  </div>

  <div class="card center">
    <button class="big-btn" id="startBtn">🎮 게임 시작</button>
  </div>
</div>

<!-- 입장 화면 -->
<div id="intro" class="hidden">
  <div id="introCard">🐶</div>
  <div id="introName">선수</div>
  <div id="introMsg">입장합니다!</div>
  <div class="rulebox">
    🎲 주사위를 굴려 말을 옮겨요<br>
    ❓ 칸에 도착하면 퀴즈를 풀어요 (정답 +점수)<br>
    🔑 황금열쇠 · 🚩출발 · 🎰럭키 칸도 있어요<br>
    🏆 점수가 가장 높은 사람이 1등!
  </div>
  <button class="big-btn" id="introBtn" style="margin-top:24px;">준비되었나요? ▶</button>
</div>

<!-- 게임 화면 -->
<div id="game" class="hidden">
  <div id="board"></div>
  <div id="side">
    <div class="panel">
      <h3>🏆 점수 · 순위</h3>
      <div id="rankList"></div>
    </div>
    <div class="panel dice-area">
      <h3>🎲 주사위</h3>
      <div id="diceFace">🎲</div>
      <button class="big-btn" id="rollBtn" style="width:100%;">🎲 주사위 굴리기</button>
      <div class="mic-btns" style="margin-top:10px;">
        <button id="micBtn">🎤 마이크로 굴리기</button>
      </div>
      <div class="gauge"><div id="gaugeBar"></div></div>
      <div class="thr">
        <span>←예민</span>
        <input type="range" id="thrRange" min="50" max="220" value="160">
        <span>둔감→</span>
      </div>
    </div>
    <button class="endbtn" id="endBtn">⏹ 게임 끝내기</button>
  </div>
</div>

<div id="popup"></div>

<script>
/* ================= 데이터 (첨부 이미지 16개 지역 내용만 사용) ================= */
var CATS = {
  region:{name:"우리가 사는 지역",emoji:"🗺️",color:"#bfe3ff",pts:1},
  food:{name:"유명한 음식",emoji:"🍜",color:"#ffd8a8",pts:1},
  special:{name:"유명한 특산물",emoji:"🎁",color:"#c5f2c7",pts:1},
  place:{name:"유명한 명소",emoji:"🏛️",color:"#e7ccff",pts:2}
};

var QUIZ = {
  region:[
    {q:"N서울타워와 경복궁이 있는 곳은?",a:["서울","부산","대구","광주"],c:0},
    {q:"광안대교와 어묵으로 유명한 곳은?",a:["부산","울산","대전","세종"],c:0},
    {q:"83타워(이월드)가 있는 곳은?",a:["대구","광주","울산","제주도"],c:0},
    {q:"울산대교가 있고 고래로 유명한 곳은?",a:["울산","부산","세종","대전"],c:0},
    {q:"정부세종청사가 있는 곳은?",a:["세종","대전","서울","광주"],c:0},
    {q:"엑스포과학공원이 있는 곳은?",a:["대전","대구","울산","부산"],c:0},
    {q:"무등산과 수박으로 유명한 곳은?",a:["광주","제주도","전라북도","경기도"],c:0},
    {q:"한라산과 감귤로 유명한 곳은?",a:["제주도","강원도","경기도","충청북도"],c:0},
    {q:"수원화성이 있는 곳은?",a:["경기도","충청북도","전라남도","경상북도"],c:0},
    {q:"경주 첨성대가 있는 곳은?",a:["경상북도","경상남도","전라북도","강원도"],c:0}
  ],
  food:[
    {q:"부산의 유명한 음식은?",a:["어묵","감자","사과","굴"],c:0},
    {q:"대전 성심당의 유명한 것은?",a:["빵","어묵","대게","감귤"],c:0},
    {q:"경기도 수원의 유명한 고기 음식은?",a:["수원왕갈비","비빔밥","어묵","치즈"],c:0},
    {q:"전주의 유명한 비빔 음식은?",a:["비빔밥","어묵","굴","만두"],c:0},
    {q:"전주의 콩나물로 만든 국밥은?",a:["콩나물국밥","돼지국밥","소고기국밥","순대국밥"],c:0},
    {q:"전북 임실의 유명한 유제품은?",a:["치즈","버터","우유","요구르트"],c:0},
    {q:"전남 장흥의 유명한 소고기는?",a:["한우","돼지고기","닭고기","오리고기"],c:0},
    {q:"전남 여수 돌산의 유명한 김치는?",a:["갓김치","배추김치","총각김치","깍두기"],c:0},
    {q:"경남 통영의 유명한 조개류는?",a:["굴","대게","사과","감자"],c:0},
    {q:"서울의 유명한 간식 과자는?",a:["호두과자","어묵","빵","굴"],c:0}
  ],
  special:[
    {q:"대구의 유명한 과일은?",a:["사과","감귤","복숭아","수박"],c:0},
    {q:"세종의 유명한 과일은?",a:["복숭아","사과","감귤","배"],c:0},
    {q:"광주의 유명한 과일은?",a:["수박","사과","감귤","복숭아"],c:0},
    {q:"제주도의 유명한 과일은?",a:["감귤","사과","복숭아","수박"],c:0},
    {q:"강원도의 흙 속에서 자라는 채소는?",a:["감자","마늘","인삼","고추"],c:0},
    {q:"충청북도의 유명한 양념 채소는?",a:["마늘","감자","인삼","생강"],c:0},
    {q:"충남 금산의 유명한 약재는?",a:["인삼","마늘","감자","고추"],c:0},
    {q:"경상북도 영덕·울진의 유명한 게는?",a:["대게","꽃게","참게","농게"],c:0},
    {q:"경남 통영의 유명한 조개류는?",a:["굴","대게","사과","감자"],c:0},
    {q:"울산 앞바다의 유명한 동물은?",a:["고래","상어","문어","거북"],c:0}
  ],
  place:[
    {q:"서울의 옛 임금님 궁궐은?",a:["경복궁","불국사","수원화성","공산성"],c:0},
    {q:"부산의 유명한 큰 다리는?",a:["광안대교","울산대교","인천대교","영종대교"],c:0},
    {q:"제주도에서 가장 높은 산은?",a:["한라산","설악산","무등산","지리산"],c:0},
    {q:"강원도의 유명한 산은?",a:["설악산","한라산","무등산","관악산"],c:0},
    {q:"경기도 수원의 유명한 성은?",a:["수원화성","공산성","상당산성","경복궁"],c:0},
    {q:"충청북도 청주의 유명한 산성은?",a:["상당산성","공산성","수원화성","한라산"],c:0},
    {q:"충청남도 공주의 유명한 산성은?",a:["공산성","상당산성","수원화성","경복궁"],c:0},
    {q:"전북 전주의 유명한 마을은?",a:["전주 한옥마을","수원화성","공산성","상당산성"],c:0},
    {q:"경상북도 경주의 별을 보던 건축물은?",a:["첨성대","경복궁","수원화성","공산성"],c:0},
    {q:"광주의 유명한 산은?",a:["무등산","한라산","설악산","관악산"],c:0}
  ]
};

/* ================= 보드 구성 (40칸) ================= */
var GOLDEN=[5,15,22,25,35];
var CELLS=[];
(function buildCells(){
  var catKeys=["region","food","special","place"];
  var qi=0;
  for(var i=0;i<40;i++){
    if(i===0){CELLS.push({t:"start",e:"🚩",label:"출발",color:"#fff3c4"});}
    else if(i===10){CELLS.push({t:"island",e:"🏝️",label:"무인도",color:"#cdeffd"});}
    else if(i===20){CELLS.push({t:"travel",e:"✈️",label:"자유여행",color:"#ffe1ef"});}
    else if(i===30){CELLS.push({t:"lucky",e:"🎰",label:"럭키",color:"#e6e1ff"});}
    else if(GOLDEN.indexOf(i)>=0){CELLS.push({t:"golden",e:"🔑",label:"황금열쇠",color:"#ffe9a8"});}
    else{var ck=catKeys[qi%catKeys.length];qi++;CELLS.push({t:"quiz",cat:ck,e:CATS[ck].emoji,label:CATS[ck].name,color:CATS[ck].color});}
  }
})();

/* ================= 상태 ================= */
var EMOJIS=["🐶","🐱","🐰","🐻","🐼","🦊","🐸","🐯","🐨","🐷"];
var players=[];
var totalTurns=6;
var turnCount=0;
var cur=0;
var busy=false;
var quizPool={};

/* ================= 설정 화면 ================= */
var playersDiv=document.getElementById("players");
function addPlayerRow(name){
  if(playersDiv.children.length>=10)return;
  var idx=playersDiv.children.length;
  var row=document.createElement("div");
  row.className="pl-row";
  row.innerHTML='<span class="em">'+EMOJIS[idx]+'</span><input type="text" maxlength="6" value="'+(name||"")+'" placeholder="이름 '+(idx+1)+'"><button class="del">✖</button>';
  row.querySelector(".del").onclick=function(){row.remove();refreshEmojis();};
  playersDiv.appendChild(row);
}
function refreshEmojis(){
  var rows=playersDiv.children;
  for(var i=0;i<rows.length;i++){rows[i].querySelector(".em").textContent=EMOJIS[i];rows[i].querySelector("input").placeholder="이름 "+(i+1);}
}
document.getElementById("addBtn").onclick=function(){addPlayerRow();refreshEmojis();};
addPlayerRow("");addPlayerRow("");

var turnGrid=document.getElementById("turnGrid");
[3,4,5,6,7,8,10,12,15,20].forEach(function(t){
  var b=document.createElement("button");b.textContent=t+"턴";
  if(t===6)b.classList.add("on");
  b.onclick=function(){[].forEach.call(turnGrid.children,function(c){c.classList.remove("on");});b.classList.add("on");totalTurns=t;};
  turnGrid.appendChild(b);
});

document.getElementById("startBtn").onclick=function(){
  var rows=playersDiv.children;players=[];
  for(var i=0;i<rows.length;i++){
    var nm=rows[i].querySelector("input").value.trim()||("선수"+(i+1));
    players.push({name:nm,emoji:EMOJIS[i],pos:0,score:0,combo:0,skip:false});
  }
  if(players.length<2){alert("선수를 2명 이상 적어 주세요!");return;}
  startIntro();
};

/* ================= 입장 화면 ================= */
var introIdx=0;
function startIntro(){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("intro").classList.remove("hidden");
  introIdx=0;showIntro();
}
function showIntro(){
  var p=players[introIdx];
  var card=document.getElementById("introCard");
  card.style.animation="none";void card.offsetWidth;card.style.animation="slidein .6s ease";
  card.textContent=p.emoji;
  document.getElementById("introName").textContent=p.name;
  beep(660,.12);
  var btn=document.getElementById("introBtn");
  btn.textContent=(introIdx<players.length-1)?"다음 선수 ▶":"게임 시작! ▶";
}
document.getElementById("introBtn").onclick=function(){
  if(introIdx<players.length-1){introIdx++;showIntro();}
  else{document.getElementById("intro").classList.add("hidden");startGame();}
};

/* ================= 게임 시작 ================= */
function startGame(){
  document.getElementById("game").classList.remove("hidden");
  resetPools();
  buildBoard();
  renderRank();
  cur=0;turnCount=0;
  updateCenter();
  placeTokens();
}
function resetPools(){for(var k in QUIZ){quizPool[k]=shuffle(QUIZ[k].slice());}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ================= 보드 그리기 ================= */
var board=document.getElementById("board");
function posToGrid(i){
  // 11x11 둘레. 상단 0~10, 우측 11~19, 하단 20~30(우→좌), 좌측 31~39(아래→위)
  if(i<=10)return{r:1,c:i+1};
  if(i<=19)return{r:i-9,c:11};
  if(i<=30)return{r:11,c:11-(i-20)};
  return{r:11-(i-30),c:1};
}
function buildBoard(){
  board.innerHTML="";
  for(var i=0;i<40;i++){
    var g=posToGrid(i);var ce=CELLS[i];
    var d=document.createElement("div");
    d.className="cell"+((i%10===0)?" corner":"");
    d.style.gridRow=g.r;d.style.gridColumn=g.c;
    d.style.background=ce.color;
    d.id="cell"+i;
    d.innerHTML='<span class="cn">'+i+'</span><span class="ce">'+ce.e+'</span><span>'+ce.label+'</span>';
    board.appendChild(d);
  }
  var ca=document.createElement("div");
  ca.className="center-area";
  ca.innerHTML='<h2>🗺️ 우리나라 시와 도</h2><div class="turninfo" id="turnInfo"></div><div class="nowp" id="nowP"></div>';
  board.appendChild(ca);
  for(var k=0;k<players.length;k++){
    var t=document.createElement("div");
    t.className="token";t.id="tok"+k;t.textContent=players[k].emoji;
    board.appendChild(t);
  }
}
function getCellCenter(boardPos){
  var cell=document.getElementById("cell"+boardPos);
  var br=board.getBoundingClientRect();
  var cr=cell.getBoundingClientRect();
  return{x:cr.left-br.left+cr.width/2,y:cr.top-br.top+cr.height/2};
}
function placeTokens(){
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    for(var k=0;k<players.length;k++){
      var bp=players[k].pos%40;
      var c=getCellCenter(bp);
      var tok=document.getElementById("tok"+k);
      var n=players.length>1?players.length:1;
      var off=(k-(players.length-1)/2)*13;
      tok.style.left=(c.x+off-12)+"px";
      tok.style.top=(c.y-12)+"px";
    }
  });});
}

/* ================= 중앙 정보 ================= */
function updateCenter(){
  document.getElementById("turnInfo").textContent="턴 "+(turnCount+1)+" / "+totalTurns;
  var p=players[cur];
  document.getElementById("nowP").innerHTML=p.emoji+" "+p.name+" 차례";
}

/* ================= 순위 ================= */
function renderRank(){
  var list=document.getElementById("rankList");
  var sorted=players.map(function(p,i){return{p:p,i:i};}).sort(function(a,b){return b.p.score-a.p.score||(b.p.pos-a.p.pos);});
  list.innerHTML="";
  sorted.forEach(function(o,r){
    var row=document.createElement("div");
    row.className="rank-row"+(o.i===cur?" me":"");
    var medal=r===0?"🥇":r===1?"🥈":r===2?"🥉":(r+1)+".";
    var combo=o.p.combo>=2?'<span class="combo">🔥'+o.p.combo+'</span>':"";
    row.innerHTML='<span>'+medal+'</span><span class="em">'+o.p.emoji+'</span><span class="nm">'+o.p.name+' '+combo+'</span><span class="sc">'+o.p.score+'점</span>';
    list.appendChild(row);
  });
}

/* ================= 주사위 ================= */
var rolling=false;
function rollDice(){
  if(busy||rolling)return;
  rolling=true;micCooldown=Date.now()+2500;
  var face=document.getElementById("diceFace");
  var faces=["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣"];
  var n=0,cnt=0;
  var iv=setInterval(function(){
    n=Math.floor(Math.random()*6);face.textContent=faces[n];beep(400+n*40,.04);
    cnt++;
    if(cnt>12){
      clearInterval(iv);
      var val=Math.floor(Math.random()*6)+1;
      face.textContent=faces[val-1];
      rolling=false;
      moveBy(val);
    }
  },70);
}
document.getElementById("rollBtn").onclick=rollDice;

/* ================= 이동 ================= */
function moveBy(steps){
  busy=true;
  var p=players[cur];
  var i=0;
  function step(){
    if(i>=steps){arrive();return;}
    p.pos++;
    if(p.pos%40===0){p.score++;sparkle();beep(880,.1);renderRank();}
    placeTokens();beep(520,.05);
    i++;
    setTimeout(step,260);
  }
  step();
}
function arrive(){
  var p=players[cur];
  var bp=p.pos%40;var ce=CELLS[bp];
  renderRank();
  if(ce.t==="quiz")openQuiz(ce.cat);
  else if(ce.t==="start"){endTurn();}
  else if(ce.t==="island")openSimple("🏝️","무인도",p.name+" 님은 한 턴 쉬어요!",function(){p.skip=true;endTurn();});
  else if(ce.t==="travel")openTravel();
  else if(ce.t==="lucky")openLucky();
  else if(ce.t==="golden")openGolden();
}

/* ================= 퀴즈 ================= */
var popup=document.getElementById("popup");
function nextQuestion(cat){
  if(!quizPool[cat]||quizPool[cat].length===0)quizPool[cat]=shuffle(QUIZ[cat].slice());
  return quizPool[cat].pop();
}
function openQuiz(cat){
  var c=CATS[cat];var q=nextQuestion(cat);
  var correctText=q.a[q.c];
  var opts=q.a.map(function(t,idx){return{t:t,correct:idx===q.c};});
  shuffle(opts);
  var html='<div class="overlay"><div class="modal">';
  html+='<div class="qhead" style="background:'+c.color+'">'+c.emoji+' '+c.name+' <span style="font-size:18px;">(+'+c.pts+'점)</span></div>';
  html+='<div class="qtext">'+q.q+'</div><div class="opts">';
  opts.forEach(function(o,idx){
    html+='<button class="opt" data-correct="'+(o.correct?1:0)+'"><span class="num">'+(idx+1)+'</span>'+o.t+'</button>';
  });
  html+='</div><div id="qresult"></div></div></div>';
  popup.innerHTML=html;
  var btns=popup.querySelectorAll(".opt");
  btns.forEach(function(b){
    b.onclick=function(){
      btns.forEach(function(x){x.disabled=true;});
      var isC=b.getAttribute("data-correct")==="1";
      btns.forEach(function(x){if(x.getAttribute("data-correct")==="1")x.classList.add("correct");});
      var p=players[cur];var res=document.getElementById("qresult");
      if(isC){
        var gain=c.pts;p.combo++;
        var comboBonus=p.combo>=2?1:0;gain+=comboBonus;
        p.score+=gain;
        beep(880,.15);sparkle();
        res.innerHTML='<div class="result" style="color:#27ae60;">🎉 정답! +'+gain+'점'+(comboBonus?' (🔥콤보 +'+comboBonus+')':'')+'</div>';
      }else{
        b.classList.add("wrong");p.combo=0;
        beep(200,.2);
        res.innerHTML='<div class="result" style="color:#e74c3c;">😊 아쉬워요! 정답은 "'+correctText+'"';
      }
      renderRank();
      res.innerHTML+='<button class="big-btn" id="qnext">확인 ▶ 다음</button></div>';
      document.getElementById("qnext").onclick=function(){popup.innerHTML="";endTurn();};
    };
  });
}

/* ================= 간단 팝업 ================= */
function openSimple(emoji,title,msg,cb){
  popup.innerHTML='<div class="overlay"><div class="modal"><div class="em-big">'+emoji+'</div><h2>'+title+'</h2><p>'+msg+'</p><button class="big-btn" id="sok">확인 ▶</button></div></div>';
  document.getElementById("sok").onclick=function(){popup.innerHTML="";cb();};
}

/* ================= 자유여행 ================= */
function openTravel(){
  var html='<div class="overlay"><div class="modal"><div class="em-big">✈️</div><h2>자유여행!</h2><p>어디로 갈까요? 칸 번호를 골라요.</p><div class="travel-grid">';
  for(var i=0;i<40;i++){html+='<button data-pos="'+i+'">'+i+'<br>'+CELLS[i].e+'</button>';}
  html+='</div></div></div>';
  popup.innerHTML=html;
  popup.querySelectorAll(".travel-grid button").forEach(function(b){
    b.onclick=function(){
      var target=parseInt(b.getAttribute("data-pos"));
      var p=players[cur];
      var curBp=p.pos%40;
      var diff=(target-curBp+40)%40;
      if(diff===0)diff=40;
      popup.innerHTML="";
      moveBy(diff);
    };
  });
}

/* ================= 럭키 주사위 ================= */
function openLucky(){
  popup.innerHTML='<div class="overlay"><div class="modal"><div class="em-big">🎰</div><h2>럭키 주사위!</h2><p>주사위를 굴려 보너스 점수!</p><div id="luckyFace" style="font-size:70px;">🎲</div><button class="big-btn" id="luckyRoll">굴리기 🎲</button></div></div>';
  document.getElementById("luckyRoll").onclick=function(){
    var btn=document.getElementById("luckyRoll");btn.disabled=true;
    var faces=["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣"];var cnt=0;
    var iv=setInterval(function(){
      document.getElementById("luckyFace").textContent=faces[Math.floor(Math.random()*6)];beep(450,.04);cnt++;
      if(cnt>10){
        clearInterval(iv);
        var val=Math.floor(Math.random()*6)+1;
        document.getElementById("luckyFace").textContent=faces[val-1];
        var p=players[cur];p.score+=val;renderRank();sparkle();beep(880,.15);
        var m=document.querySelector(".modal");
        m.innerHTML='<div class="em-big">🎰</div><h2>+'+val+'점!</h2><p>보너스 점수를 받았어요!</p><button class="big-btn" id="lok">확인 ▶</button>';
        document.getElementById("lok").onclick=function(){popup.innerHTML="";endTurn();};
      }
    },80);
  };
}

/* ================= 황금열쇠 ================= */
var GEVENTS=[
  {e:"🎉",t:"보너스! +2점",fn:function(p){p.score+=2;}},
  {e:"🚀",t:"3칸 앞으로!",fn:function(p){p.pos+=3;}},
  {e:"🎲",t:"주사위 한 번 더!",fn:function(p){p._again=true;}},
  {e:"🔄",t:"다른 친구와 자리 바꾸기!",fn:function(p){var o=Math.floor(Math.random()*players.length);var tmp=p.pos;p.pos=players[o].pos;players[o].pos=tmp;}},
  {e:"💀",t:"2칸 뒤로!",fn:function(p){p.pos=Math.max(0,p.pos-2);}},
  {e:"😴",t:"다음 턴 쉬기!",fn:function(p){p.skip=true;}},
  {e:"🌀",t:"랜덤 칸으로 워프!",fn:function(p){p.pos=Math.floor(p.pos/40)*40+Math.floor(Math.random()*40);}},
  {e:"😈",t:"점수 1점 도둑!",fn:function(p){p.score=Math.max(0,p.score-1);}}
];
function openGolden(){
  var ev=GEVENTS[Math.floor(Math.random()*GEVENTS.length)];
  popup.innerHTML='<div class="overlay"><div class="modal"><h2>🔑 황금열쇠!</h2><div class="flip" id="flip"><div class="flip-inner"><div class="flip-face flip-front">🔑</div><div class="flip-face flip-back"><span class="be">'+ev.e+'</span><span>'+ev.t+'</span></div></div></div><div id="gbtn"></div></div></div>';
  beep(600,.1);
  setTimeout(function(){document.getElementById("flip").classList.add("go");beep(880,.15);},400);
  setTimeout(function(){
    var p=players[cur];ev.fn(p);sparkle();renderRank();placeTokens();
    document.getElementById("gbtn").innerHTML='<button class="big-btn" id="gok">확인 ▶</button>';
    document.getElementById("gok").onclick=function(){
      popup.innerHTML="";
      if(p._again){p._again=false;busy=false;
        openSimple("🎲","한 번 더!",p.name+" 님, 주사위를 한 번 더 굴려요!",function(){busy=false;});
      }else{endTurn();}
    };
  },1300);
}

/* ================= 턴 종료 ================= */
function endTurn(){
  busy=false;
  turnCount;
  // 다음 플레이어
  var loops=0;
  do{
    cur++;
    if(cur>=players.length){cur=0;turnCount++;}
    loops++;
    if(turnCount>=totalTurns){gameOver();return;}
    if(players[cur].skip){players[cur].skip=false;
      // 쉬는 차례 알림 없이 넘어감
    }else break;
  }while(loops<players.length*3);
  updateCenter();renderRank();
}

/* ================= 게임 종료 ================= */
function gameOver(){
  busy=true;
  confetti();
  var sorted=players.map(function(p){return p;}).sort(function(a,b){return b.score-a.score||(b.pos-a.pos);});
  var html='<div class="overlay"><div class="modal"><div class="em-big">🏆</div><h2>게임 끝!</h2><div style="margin:14px 0;">';
  sorted.forEach(function(p,r){
    var medal=r===0?"🥇":r===1?"🥈":r===2?"🥉":(r+1)+".";
    html+='<div class="rank-row"><span>'+medal+'</span><span class="em">'+p.emoji+'</span><span class="nm">'+p.name+'</span><span class="sc">'+p.score+'점</span></div>';
  });
  html+='</div><button class="big-btn" onclick="location.reload()">🔄 다시 하기</button></div></div>';
  popup.innerHTML=html;
  beep(880,.2);setTimeout(function(){beep(1100,.3);},200);
}
document.getElementById("endBtn").onclick=function(){
  popup.innerHTML='<div class="overlay"><div class="modal"><div class="em-big">⏹</div><h2>게임을 끝낼까요?</h2><div style="display:flex;gap:12px;justify-content:center;margin-top:16px;"><button class="big-btn" id="yesEnd">네, 끝내기</button><button class="addbtn" id="noEnd" style="width:auto;padding:16px 24px;">아니요</button></div></div></div>';
  document.getElementById("yesEnd").onclick=function(){popup.innerHTML="";gameOver();};
  document.getElementById("noEnd").onclick=function(){popup.innerHTML="";};
};

/* ================= 효과음 (Web Audio) ================= */
var AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(freq,dur){
  var a=ac();if(!a)return;if(a.state==="suspended")a.resume();
  var o=a.createOscillator(),g=a.createGain();
  o.frequency.value=freq;o.type="sine";o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.start();o.stop(a.currentTime+dur);
}

/* ================= 효과 ================= */
function sparkle(){
  var s=document.createElement("div");s.className="spark";
  var bp=players[cur].pos%40;
  document.getElementById("cell"+bp).appendChild(s);
  setTimeout(function(){s.remove();},600);
}
function confetti(){
  var colors=["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff8a3d","#c780ff"];
  for(var i=0;i<80;i++){
    (function(){
      var c=document.createElement("div");c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animation="fall "+(2+Math.random()*2)+"s linear "+(Math.random())+"s forwards";
      document.body.appendChild(c);
      setTimeout(function(){c.remove();},5000);
    })();
  }
}

/* ================= 마이크 주사위 ================= */
var micOn=false,micStream=null,analyser=null,micData=null,micRAF=null,micCooldown=0,threshold=160;
document.getElementById("thrRange").oninput=function(){threshold=parseInt(this.value);};
document.getElementById("micBtn").onclick=function(){micOn?stopMic():startMic();};
function startMic(){
  var a=ac();if(a&&a.state==="suspended")a.resume();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
    micStream=stream;var src=a.createMediaStreamSource(stream);
    analyser=a.createAnalyser();analyser.fftSize=2048;
    micData=new Uint8Array(analyser.fftSize);
    src.connect(analyser);
    micOn=true;
    document.getElementById("micBtn").textContent="🎤 마이크 끄기";
    document.getElementById("micBtn").classList.add("on");
    document.getElementById("rollBtn").classList.add("hidden");
    micLoop();
  }).catch(function(){
    alert("마이크를 사용할 수 없어요. 버튼으로 굴려 주세요!");
  });
}
function stopMic(){
  micOn=false;
  if(micRAF)cancelAnimationFrame(micRAF);
  if(micStream){micStream.getTracks().forEach(function(t){t.stop();});}
  document.getElementById("micBtn").textContent="🎤 마이크로 굴리기";
  document.getElementById("micBtn").classList.remove("on");
  document.getElementById("rollBtn").classList.remove("hidden");
  document.getElementById("gaugeBar").style.width="0%";
}
function micLoop(){
  if(!micOn)return;
  analyser.getByteTimeDomainData(micData);
  var peak=0;
  for(var i=0;i<micData.length;i++){var v=Math.abs(micData[i]-128);if(v>peak)peak=v;}
  var pct=Math.min(100,peak/128*100*1.6);
  var bar=document.getElementById("gaugeBar");
  bar.style.width=pct+"%";
  bar.style.background=pct>75?"#e74c3c":pct>45?"#f1c40f":"#2ecc71";
  if(peak>threshold&&Date.now()>micCooldown&&!busy&&!rolling){
    micCooldown=Date.now()+2000;
    rollDice();
  }
  micRAF=requestAnimationFrame(micLoop);
}

window.addEventListener("resize",placeTokens);
</script>
