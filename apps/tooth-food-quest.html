<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치아 튼튼 음식 탐험대</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-color: #FFF8E1;
            --primary: #E65100;
            --primary-hover: #FF9800;
            --secondary: #4CAF50;
            --text-dark: #212121;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 공통 버튼 스타일 (접근성: 최소 48px, 고대비, 굵은 폰트) */
        button {
            min-width: 64px;
            min-height: 64px;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            border: 4px solid var(--primary);
            border-radius: 20px;
            background-color: var(--white);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--primary);
        }

        button:focus {
            outline: 4px dashed #D50000;
            outline-offset: 4px;
        }

        /* 화면 컨테이너 */
        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        /* 시작 & 레벨 선택 화면 */
        h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        
        .level-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
        }

        .level-btn {
            background-color: var(--primary);
            color: var(--white);
            font-size: 1.8rem;
            padding: 20px;
        }

        /* 게임 화면 */
        .instruction-box {
            background-color: var(--white);
            border: 4px solid var(--primary-hover);
            border-radius: 20px;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: 800;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tts-icon {
            font-size: 2.5rem;
            background: #FFF3E0;
            border-radius: 50%;
            padding: 10px;
        }

        /* 치아(얼굴) 영역 */
        .face-area {
            font-size: 10rem;
            margin: 20px 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .face-area.animate {
            transform: scale(1.2);
        }

        /* 양치질 버튼 영역 */
        #toothbrush-btn {
            background-color: #2196F3;
            border-color: #0D47A1;
            color: white;
            box-shadow: 0 6px 0 #0D47A1;
            font-size: 2rem;
            animation: pulse 1.5s infinite;
            display: none;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 음식 선택 영역 */
        .food-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .food-btn {
            flex-direction: column;
            width: 160px;
            height: 180px;
            font-size: 1.5rem;
            gap: 15px;
        }

        .food-emoji {
            font-size: 4rem;
        }

        /* 다음 버튼 */
        #next-btn {
            background-color: var(--secondary);
            border-color: #1B5E20;
            color: white;
            box-shadow: 0 6px 0 #1B5E20;
            margin-top: 30px;
            font-size: 1.8rem;
            display: none;
        }

        /* 피드백 모달 */
        #feedback-msg {
            font-size: 2rem;
            font-weight: 800;
            color: #D84315;
            margin-top: 20px;
            min-height: 3rem;
        }

    </style>
</head>
<body>

    <div id="screen-start" class="screen active">
        <h1>🦷 치아 튼튼 탐험대 🍎</h1>
        <h2>어떤 음식이 치아를 웃게 할까요?</h2>
        <div class="level-container">
            <button class="level-btn" onclick="startGame(1)">🟢 1단계: 이름 듣고 찾기</button>
            <button class="level-btn" onclick="startGame(2)">🟡 2단계: 건강한 음식 고르기</button>
            <button class="level-btn" onclick="startGame(3)">🔴 3단계: 수수께끼 맞추기</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="instruction-box" onclick="playCurrentInstruction()" tabindex="0" role="button" aria-label="문제 다시 듣기">
            <span class="tts-icon" aria-hidden="true">🔊</span>
            <span id="instruction-text">여기에 문제가 나옵니다.</span>
        </div>

        <div id="face-area" class="face-area">
            <span id="face-emoji">😃</span>
        </div>

        <button id="toothbrush-btn" onclick="useToothbrush()">🪥 치카치카 양치하기!</button>

        <div id="feedback-msg"></div>

        <div id="food-container" class="food-container">
            </div>

        <button id="next-btn" onclick="nextQuestion()">다음 문제 ➡️</button>
    </div>

    <div id="screen-end" class="screen">
        <h1>🎉 참 잘했어요! 🎉</h1>
        <div class="face-area" style="font-size: 8rem;">😃✨🦷</div>
        <h2>치아가 아주 튼튼해졌어요! 최고예요! 👍</h2>
        <button onclick="location.reload()" style="margin-top: 30px; background-color: var(--primary); color: white;">🏠 처음으로 돌아가기</button>
    </div>

    <script>
        // 퀴즈 데이터 구성
        const quizData = {
            1: [
                {
                    instruction: "아삭아삭 맛있는 '사과'는 어디 있을까? 사과를 찾아서 친구 입에 쏙 넣어주자!",
                    targetId: 'apple', targetType: 'good',
                    successMsg: "와! 사과를 먹었더니 치아가 튼튼해지고 기분이 좋아졌어요!",
                    options: [
                        { id: 'apple', emoji: '🍎', name: '사과' },
                        { id: 'choco', emoji: '🍫', name: '초콜릿' },
                        { id: 'pizza', emoji: '🍕', name: '피자' }
                    ]
                },
                {
                    instruction: "달콤한 '초콜릿'은 어디 있지? 초콜릿을 입에 넣어주면 치아가 어떻게 될까?",
                    targetId: 'choco', targetType: 'bad',
                    successMsg: "앗! 끈적끈적한 초콜릿을 먹었더니 충치 벌레가 와서 이가 아파요!",
                    options: [
                        { id: 'rice', emoji: '🍚', name: '밥' },
                        { id: 'choco', emoji: '🍫', name: '초콜릿' },
                        { id: 'apple', emoji: '🍎', name: '사과' }
                    ]
                },
                {
                    instruction: "우리가 매일 먹는 든든한 '밥'을 찾아 입에 넣어볼까?",
                    targetId: 'rice', targetType: 'good',
                    successMsg: "최고예요! 밥은 우리 몸도 튼튼하게, 치아도 튼튼하게 해줘요!",
                    options: [
                        { id: 'jelly', emoji: '🍬', name: '젤리' },
                        { id: 'cola', emoji: '🥤', name: '콜라' },
                        { id: 'rice', emoji: '🍚', name: '밥' }
                    ]
                }
            ],
            2: [
                {
                    instruction: "여기 피자와 채소가 있어요. 치아를 활짝 웃게 만들어 줄 건강한 음식은 무엇일까요?",
                    targetType: 'good', // 2단계는 무조건 좋은 음식을 고르는 것이 정답
                    successMsg: "맞아요! 채소를 먹으면 치아가 아주 튼튼해져요!",
                    options: [
                        { id: 'pizza', emoji: '🍕', name: '피자', type: 'bad' },
                        { id: 'broccoli', emoji: '🥦', name: '채소', type: 'good' }
                    ]
                },
                {
                    instruction: "충치 벌레가 싫어하는 건강한 음식은 무엇일까요? 입에 넣어주세요.",
                    targetType: 'good',
                    successMsg: "잘했어요! 신선한 과일은 천연 칫솔이에요!",
                    options: [
                        { id: 'icecream', emoji: '🍦', name: '아이스크림', type: 'bad' },
                        { id: 'watermelon', emoji: '🍉', name: '과일', type: 'good' }
                    ]
                },
                {
                    instruction: "치아가 썩지 않게 도와주는 튼튼한 음식을 골라주세요!",
                    targetType: 'good',
                    successMsg: "정말 잘했어요! 밥을 먹고 방긋 웃어요!",
                    options: [
                        { id: 'rice', emoji: '🍚', name: '밥', type: 'good' },
                        { id: 'chicken', emoji: '🍗', name: '치킨', type: 'bad' }
                    ]
                }
            ],
            3: [
                {
                    instruction: "이 채소는 식이섬유가 아주 풍부해요. 아삭아삭 씹을 때 치아를 닦아주는 이것은 무엇일까요?",
                    targetId: 'carrot', targetType: 'good',
                    successMsg: "맞아요! 당근을 먹으면 눈도 치아도 건강해져요!",
                    options: [
                        { id: 'carrot', emoji: '🥕', name: '당근' },
                        { id: 'cola', emoji: '🥤', name: '콜라' },
                        { id: 'jelly', emoji: '🍬', name: '젤리' }
                    ]
                },
                {
                    instruction: "칼슘이 듬뿍 들어있어서 뼈와 치아를 단단하게 만들어주는 이 음식은 무엇일까요?",
                    targetId: 'milk', targetType: 'good',
                    successMsg: "최고예요! 우유를 마시면 치아에 튼튼한 방패가 생겨요!",
                    options: [
                        { id: 'choco', emoji: '🍫', name: '초콜릿' },
                        { id: 'milk', emoji: '🥛', name: '우유' },
                        { id: 'pizza', emoji: '🍕', name: '피자' }
                    ]
                },
                {
                    instruction: "설탕이 많이 들어있고 끈적해서 먹고 나면 치아 표면에 찰싹 달라붙어 치아를 아프게 하는 것은 무엇일까요?",
                    targetId: 'jelly', targetType: 'bad',
                    successMsg: "앗! 젤리를 먹었더니 충치 벌레가 생겼어요!",
                    options: [
                        { id: 'apple', emoji: '🍎', name: '사과' },
                        { id: 'broccoli', emoji: '🥦', name: '채소' },
                        { id: 'jelly', emoji: '🍬', name: '젤리' }
                    ]
                }
            ]
        };

        // 상태 변수
        let currentLevel = 1;
        let currentQuestionIndex = 0;
        let questions = [];
        let currentQ = null;
        let isWaitingForRetry = false;

        // TTS (음성 합성) 함수 - 한국어, 속도 0.8
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 이전 음성 취소
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ko-KR';
                msg.rate = 0.8;
                window.speechSynthesis.speak(msg);
            }
        }

        // 화면 전환 함수
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 게임 시작
        function startGame(level) {
            currentLevel = level;
            questions = quizData[level];
            currentQuestionIndex = 0;
            showScreen('screen-game');
            loadQuestion();
        }

        // 문제 로드
        function loadQuestion() {
            currentQ = questions[currentQuestionIndex];
            isWaitingForRetry = false;
            
            // UI 초기화
            document.getElementById('instruction-text').innerText = currentQ.instruction;
            document.getElementById('face-emoji').innerText = '😃';
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('toothbrush-btn').style.display = 'none';
            
            const foodContainer = document.getElementById('food-container');
            foodContainer.innerHTML = '';
            foodContainer.style.display = 'flex';

            // 음식 버튼 생성 (무작위 섞기 기능 포함)
            const shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(food => {
                const btn = document.createElement('button');
                btn.className = 'food-btn';
                btn.innerHTML = `<span class="food-emoji">${food.emoji}</span><span>${food.name}</span>`;
                btn.onclick = () => handleFoodClick(food);
                foodContainer.appendChild(btn);
            });

            // 문제 읽어주기
            playCurrentInstruction();
        }

        function playCurrentInstruction() {
            speak(currentQ.instruction);
        }

        // 음식 클릭 처리 로직
        function handleFoodClick(food) {
            if (isWaitingForRetry) return; // 양치질 대기 중에는 다른 버튼 클릭 방지

            if (currentLevel === 1 || currentLevel === 3) {
                // 특정 음식을 찾아야 하는 레벨
                if (food.id === currentQ.targetId) {
                    processResult(currentQ.targetType);
                } else {
                    // 오답일 경우 (긍정적 피드백 사용)
                    speak("다시 해봐요! " + getTargetName(currentQ.targetId) + "를 찾아볼까요?");
                    document.getElementById('feedback-msg').innerText = "💡 다시 해봐요!";
                }
            } else if (currentLevel === 2) {
                // 무조건 좋은 음식을 골라야 하는 레벨
                if (food.type === 'good') {
                    processResult('good');
                } else {
                    // 나쁜 음식을 골랐을 때 -> 양치질 유도 후 다시 선택하게 함
                    processResult('bad', true);
                }
            }
        }

        // 타겟 이름 찾기 헬퍼 함수
        function getTargetName(id) {
            const target = currentQ.options.find(opt => opt.id === id);
            return target ? target.name : "정답";
        }

        // 결과 처리 및 시각적 애니메이션
        function processResult(type, requiresRetry = false) {
            const face = document.getElementById('face-emoji');
            const faceArea = document.getElementById('face-area');
            const feedbackMsg = document.getElementById('feedback-msg');
            const foodContainer = document.getElementById('food-container');

            // 클릭한 음식 숨기기 방지 (UI 정돈을 위해 비활성화만)
            foodContainer.style.display = 'none';
            faceArea.classList.add('animate');
            setTimeout(() => faceArea.classList.remove('animate'), 300);

            if (type === 'good') {
                face.innerText = '😁✨';
                feedbackMsg.innerText = "🌟 참 잘했어요! 🌟";
                speak(currentQ.successMsg);
                document.getElementById('next-btn').style.display = 'inline-flex';
            } else {
                face.innerText = '😫🦷';
                feedbackMsg.innerText = "앗! 충치 벌레가 왔어요!";
                
                // 나쁜 음식을 찾는 것이 정답인 문항(1,3단계) vs 좋은 음식을 찾아야 하는데 틀린 문항(2단계)
                if (requiresRetry) {
                    speak("앗! 이가 아파요. 양치질을 해서 깨끗하게 한 다음, 다시 좋은 음식을 골라볼까요?");
                    isWaitingForRetry = true;
                } else {
                    speak(currentQ.successMsg + " 어떡하지? 양치질을 해서 다시 튼튼하게 만들어줄까?");
                    isWaitingForRetry = false; // 양치 후 바로 다음 문제로
                }
                
                setTimeout(() => {
                    document.getElementById('toothbrush-btn').style.display = 'inline-flex';
                }, 2500); // 음성이 끝날 즈음 버튼 표시
            }
        }

        // 양치질 버튼 클릭 시
        function useToothbrush() {
            const face = document.getElementById('face-emoji');
            const faceArea = document.getElementById('face-area');
            
            document.getElementById('toothbrush-btn').style.display = 'none';
            faceArea.classList.add('animate');
            setTimeout(() => faceArea.classList.remove('animate'), 300);
            
            face.innerText = '😃✨';
            
            if (isWaitingForRetry) {
                // 2단계에서 오답 선택 후 양치질 완료 -> 다시 선택 창 보여주기
                document.getElementById('feedback-msg').innerText = "우와! 다시 깨끗해졌어요! 좋은 음식을 다시 골라봐요.";
                speak("우와! 다시 깨끗해졌어요! 치아에 좋은 건강한 음식을 다시 골라볼까요?");
                isWaitingForRetry = false;
                setTimeout(() => {
                    document.getElementById('food-container').style.display = 'flex';
                }, 3000);
            } else {
                // 1,3단계에서 정답(나쁜 음식) 선택 후 양치질 완료 -> 다음 문제로
                document.getElementById('feedback-msg').innerText = "우와! 치카치카 잘했어요!";
                speak("우와! 양치질을 했더니 다시 튼튼해졌어요. 정말 잘했어요!");
                document.getElementById('next-btn').style.display = 'inline-flex';
            }
        }

        // 다음 문제로 이동
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                // 모든 문제 완료
                showScreen('screen-end');
                speak("모든 문제를 다 풀었어요! 치아가 아주 튼튼해졌어요. 최고예요!");
            }
        }
    </script>
</body>
</html>
